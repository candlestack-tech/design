<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CandleStack</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  /* Tokens: the approved app (design/mockups/app) and Backtest names (design/mockups/backtest-names) */
  :root {
    --bg: #fafaf9; --ink: #141414; --muted: #686868; --rule: #e7e5e2; --accent: #0f766e;
    --warn: #a15c07; --down: #b42318; --up: #1a7f37;
    --grid: rgb(28 25 23 / 0.09); --shadow: rgb(0 0 0 / 0.08); --on-accent: #fafaf9; --tile: #ffffff;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d0f11; --ink: #ecedee; --muted: #9ba1a6; --rule: #23272b; --accent: #3cc7a6;
    --warn: #e8b45a; --down: #f0616d; --up: #43b049;
    --grid: rgb(230 232 234 / 0.075); --shadow: rgb(0 0 0 / 0.5); --on-accent: #0d0f11; --tile: #ffffff;
    color-scheme: dark;
  }
  :root {
    --surface: color-mix(in srgb, var(--ink) 5%, var(--bg));
    --surface2: color-mix(in srgb, var(--ink) 9%, var(--bg));
    --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--bg));
    --warn-soft: color-mix(in srgb, var(--warn) 11%, var(--bg));
    --down-soft: color-mix(in srgb, var(--down) 11%, var(--bg));
    --up-soft: color-mix(in srgb, var(--up) 11%, var(--bg));
    --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
  h1, h2, h3, p { margin: 0; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .eyebrow { font: 500 11px/16px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); }
  .i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* The app frame */
  .frame { min-height: 100vh; display: flex; flex-direction: column;
    background-color: var(--bg);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px; }
  .frame > main { flex: 1; }
  .ahdr { position: relative; z-index: 30; padding: 0 24px; border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--bg) 88%, transparent); }
  .ahdr-in { max-width: 1152px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 20px; }
  .ahdr .sp { flex: 1; }
  .ahdr .r { display: flex; align-items: center; gap: 8px; }
  .home-link { appearance: none; border: 0; background: none; padding: 0; line-height: 0; border-radius: 6px; cursor: pointer; }
  .logo { height: 28px; width: 152px; display: block; }
  .lg-a { fill: var(--accent); } .lg-b { fill: var(--bg); } .lg-c { fill: var(--ink); }
  .avatar { width: 30px; height: 30px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; font: 600 12px var(--mono); flex: none; }
  .av-btn { appearance: none; border: 0; padding: 0; cursor: pointer; border-radius: 999px; line-height: 0; background: none; }
  .abody { max-width: 1200px; width: 100%; margin: 0 auto; padding: 28px 24px 40px; }
  .afoot { border-top: 1px solid var(--rule); background: var(--bg); }
  .afoot > div { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 12px; color: var(--muted); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); font: 500 14px var(--sans); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--surface); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:disabled:hover { background: var(--bg); }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.pri:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
  .btn.pri:disabled:hover { background: var(--accent); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface); }
  .btn.danger { color: var(--down); border-color: color-mix(in srgb, var(--down) 40%, var(--rule)); }
  .btn.danger:hover { background: var(--down-soft); }
  .btn.danger.solid { background: var(--down); border-color: var(--down); color: #fff; }
  .btn.danger.solid:hover { background: color-mix(in srgb, var(--down) 86%, var(--ink)); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
  .btn.sm .i { width: 14px; height: 14px; }
  .btn.icon { width: 34px; padding: 0; }
  .btn.done { color: var(--up); border-color: color-mix(in srgb, var(--up) 45%, var(--rule)); }
  .link { appearance: none; border: 0; background: none; padding: 0; color: var(--accent); font: 500 13px var(--sans); cursor: pointer; text-decoration: none; text-align: left; display: inline-flex; align-items: center; gap: 4px; }
  .link:hover { text-decoration: underline; text-underline-offset: 2px; }
  .link .i { width: 12px; height: 12px; }

  .card { background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; min-width: 0; }
  .ttl { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .ttl h1 { font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.025em; }
  .ttl p { color: var(--muted); margin-top: 4px; }
  .sec-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .sec-h h2 { font-size: 16px; font-weight: 600; }
  .sec-r { display: flex; align-items: center; gap: 10px; }
  .dd-h { display: flex; align-items: center; gap: 10px; }
  .dd-ic { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .dd-ic .i { width: 15px; height: 15px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font: 500 11px/16px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
  .tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--rule)); }
  .tag.err { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, var(--rule)); }
  .tag .i { width: 11px; height: 11px; }
  .chip { display: inline-block; font: 500 11.5px/18px var(--mono); padding: 0 7px; border: 1px solid var(--rule); border-radius: 999px; background: var(--bg); color: var(--ink); white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }

  /* Sidebar workspace (the live Sidebar.tsx) */
  .dd-ws { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: start; }
  .dd-main { min-width: 0; }
  .dd-side { display: flex; flex-direction: column; gap: 2px; padding: 8px; }
  .dd-nav { appearance: none; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: none; color: var(--muted); font: 14px var(--sans); cursor: default; text-align: left; white-space: nowrap; }
  .dd-nav.on { color: var(--ink); background: var(--surface2); font-weight: 500; }
  .dd-nav .dd-n { margin-left: auto; padding-left: 8px; font: 400 12px var(--mono); color: var(--muted); }
  .dd-sfoot { margin-top: 10px; padding: 12px 10px 4px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; }
  .meter { display: block; height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .dd-s { font: 12px var(--mono); }

  /* Settings (the live SettingsTabs, rows.tsx and DashboardCard) */
  .st-tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
  .st-tabs button { appearance: none; position: relative; padding: 9px 12px 11px; border: 0; background: none; color: var(--muted); font: 14px var(--sans); cursor: default; white-space: nowrap; }
  .st-tabs button.on { color: var(--ink); font-weight: 500; }
  .st-tabs button.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
  .st-one { max-width: 720px; display: flex; flex-direction: column; gap: 16px; }
  .st-card { display: flex; flex-direction: column; gap: 4px; padding: 16px; scroll-margin-top: 16px; }
  .st-intro { margin: -4px 0 8px; }
  .st-r { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--rule); }
  .st-r.top { align-items: start; }
  .st-l { display: flex; flex-direction: column; font-size: 13.5px; }
  .st-l .hint { font-size: 11.5px; }
  .st-c { min-width: 0; }
  .st-sub { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 14px 0 8px; border-top: 1px solid var(--rule); margin-top: 6px; }
  .st-sub h3 { font-size: 14px; font-weight: 600; display: inline-flex; gap: 8px; align-items: baseline; }
  .st-sub h3 .n { font: 400 12px var(--mono); color: var(--muted); }
  .count { font: 12px var(--mono); color: var(--muted); }
  .count.full { color: var(--warn); }

  /* The address with Copy (.st-id code) */
  .urlbox { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .urlbox code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 13px var(--mono); padding: 4px 8px; border-radius: 5px; background: var(--surface); }

  /* A key, an app: one bordered row as the Sign-in card's providers */
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .kr { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 200px) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; }
  .kr.off { background: var(--surface); }
  .kr.off .kr-n b { color: var(--muted); }
  .kr-ic { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--surface); color: var(--muted); }
  .kr-ic .i { width: 17px; height: 17px; }
  .kr-ic.app { background: var(--surface2); color: var(--ink); font: 700 15px var(--sans); }
  .kr-m { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .kr-n { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .kr-n b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .kr-n code { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .kr-n .dom { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .kr-t { display: flex; flex-direction: column; gap: 1px; font-size: 12.5px; min-width: 0; }
  .kr-t .hint { font-size: 11.5px; }
  .kr-t .warn { color: var(--warn); }
  .kr-t .err { color: var(--down); }
  .st-empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px 16px 22px; border: 1px dashed var(--rule); border-radius: 8px; text-align: center; }
  .st-empty .dd-ic { width: 38px; height: 38px; border-radius: 10px; margin-bottom: 4px; }
  .st-empty .dd-ic .i { width: 19px; height: 19px; }
  .st-empty b { font-size: 14.5px; font-weight: 600; }
  .st-empty .btn { margin-top: 8px; }
  .st-empty.sm { padding: 18px 16px; }
  .note { display: flex; gap: 9px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; font-size: 13px; background: var(--surface); }
  .note .i { margin-top: 2px; width: 15px; height: 15px; }
  .note.warn { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--rule)); }
  .note.warn .i { color: var(--warn); }
  .note.err { background: var(--down-soft); border: 1px solid color-mix(in srgb, var(--down) 35%, var(--rule)); }
  .note.err .i { color: var(--down); }
  .note.ok { background: var(--up-soft); border: 1px solid color-mix(in srgb, var(--up) 35%, var(--rule)); }
  .note.ok .i { color: var(--up); }
  .note b { font-weight: 600; }
  .note .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

  /* MCP clients: one line each, with its install guide */
  .cl { display: flex; flex-direction: column; }
  .cl-r { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; }
  .cl-r + .cl-r { border-top: 1px dashed var(--rule); }
  .cl-ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--surface2); font: 700 11px var(--sans); color: var(--ink); }
  .cl-r .w { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0; font-size: 13.5px; }
  .cl-r .w span { font-size: 12.5px; color: var(--muted); }

  /* Dialogs */
  .mbg { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: color-mix(in srgb, #000 45%, transparent); padding: 16px; }
  .mdl { width: min(520px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 20px 50px var(--shadow); }
  .mdl.wide { width: min(600px, 100%); }
  .mdl.xl { width: min(760px, 100%); }
  .mdl-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px 20px; }
  .mdl-h h2 { font-size: 17px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mdl-b { padding: 4px 20px 18px; overflow: auto; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .mdl-f { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--rule); }
  .mdl-f .hint { margin-right: auto; }
  .fld { display: flex; flex-direction: column; gap: 6px; }
  .fld-l { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 500; }
  .fld-l .cnt { font: 400 11.5px var(--mono); color: var(--muted); }
  .inp { height: 36px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 10px; background: var(--bg); font: 14px var(--sans); color: var(--ink); width: 100%; min-width: 0; }
  .inp:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 55%, var(--rule)); }
  .seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .seg button { appearance: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--muted); font: 500 13px var(--sans); cursor: pointer; white-space: nowrap; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { color: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  /* A scope with its box (the Create key dialog, the consent screen) */
  .scs { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .sc { appearance: none; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: start; width: 100%; padding: 10px 12px; border: 0; background: var(--bg); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .sc + .sc { border-top: 1px solid var(--rule); }
  .sc:hover { background: var(--surface); }
  .sc.fixed { cursor: default; }
  .sc.fixed:hover { background: var(--bg); }
  .sc .w { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .sc .w b { font-weight: 500; font-size: 13.5px; display: inline-flex; gap: 8px; align-items: baseline; }
  .sc .w b code { font: 400 11.5px var(--mono); color: var(--muted); }
  .sc .w span { font-size: 12.5px; color: var(--muted); }
  .sc .side { font-size: 11.5px; color: var(--muted); padding-top: 1px; }
  .box { width: 18px; height: 18px; margin-top: 1px; border-radius: 5px; border: 1.5px solid color-mix(in srgb, var(--muted) 60%, var(--rule)); display: grid; place-items: center; background: var(--bg); color: var(--on-accent); }
  .box .i { width: 12px; height: 12px; stroke-width: 3; visibility: hidden; }
  .sc.on .box { background: var(--accent); border-color: var(--accent); }
  .sc.on .box .i { visibility: visible; }
  .sc.fixed .box { opacity: 0.55; }

  /* The key, once */
  .secret { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 12px; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--rule)); border-radius: 8px; background: var(--accent-soft); }
  .secret code { flex: 1; min-width: 0; font: 500 13.5px/1.45 var(--mono); overflow-wrap: anywhere; }
  .snip { position: relative; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
  .snip pre { margin: 0; padding: 12px 44px 12px 12px; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .snip .c { color: var(--muted); }
  .snip .btn { position: absolute; top: 8px; right: 8px; width: 28px; padding: 0; }
  .who-k { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface); min-width: 0; }
  .who-k .kr-ic { background: var(--bg); }
  .who-k .kr-m { flex: 1; }

  /* A page of its own in the middle of the grid (the sign-in page's .si) */
  .cen { min-height: calc(100vh - 56px - 130px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 48px 16px; }
  .one { width: min(440px, 100%); padding: 28px 28px 24px; border: 1px solid var(--rule); border-radius: 12px; background: var(--bg); box-shadow: 0 10px 30px var(--shadow); display: flex; flex-direction: column; gap: 18px; }
  .one.mid { align-items: center; text-align: center; }
  .one h1 { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .one .intro { margin-top: 6px; color: var(--muted); }
  .one .intro b { color: var(--ink); font-weight: 500; }
  .one .acts { display: flex; gap: 10px; }
  .one .acts .btn { flex: 1; height: 40px; }
  .one.mid .acts { justify-content: center; }
  .one.mid .acts .btn { flex: none; }
  .legal { font-size: 12px; color: var(--muted); text-align: center; max-width: 440px; }
  .mark { width: 44px; height: 44px; display: block; }
  .pair { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .pair .app { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--surface2); font: 700 19px var(--sans); color: var(--ink); }
  .pair .dots { display: flex; gap: 4px; color: var(--muted); }
  .pair .dots i { width: 4px; height: 4px; border-radius: 999px; background: currentColor; opacity: 0.6; }
  .pair .lk { width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; border: 1px solid var(--rule); background: var(--bg); color: var(--muted); }
  .pair .lk .i { width: 13px; height: 13px; }
  .cn-top { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
  .acct { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; justify-content: center; }
  .acct .avatar { width: 20px; height: 20px; font-size: 9px; }
  .acct b { color: var(--ink); font-weight: 500; }
  .acct .link { font-size: 13px; font-weight: 400; }
  .never { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted); }
  .never .i { width: 14px; height: 14px; margin-top: 2px; }
  .si-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .si-b { appearance: none; display: flex; align-items: center; justify-content: center; gap: 10px; height: 44px; width: 100%; border-radius: 8px; font: 500 15px var(--sans); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, background-color 0.15s; }
  .si-b svg { width: 18px; height: 18px; flex: none; }
  .si-b.gh { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); }
  .si-b.gg { border: 1px solid var(--rule); background: var(--bg); color: var(--ink); }
  .si-b:hover { transform: translateY(-1px); box-shadow: 0 6px 16px var(--shadow); }
  .si-note { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .si-dot { flex: none; width: 7px; height: 7px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .st-ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface2); color: var(--muted); }
  .st-ic .i { width: 21px; height: 21px; }
  .st-ic.warn { background: var(--warn-soft); color: var(--warn); }
  .st-ic.err { background: var(--down-soft); color: var(--down); }
  .st-ic.ok { background: var(--up-soft); color: var(--up); }

  /* The upload page of a one-time link */
  .one.ul { width: min(480px, 100%); }
  .ul-top { display: flex; flex-direction: column; gap: 6px; }
  .ul-from { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
  .ul-from .cl-ic { width: 18px; height: 18px; font-size: 9.5px; border-radius: 5px; }
  .file { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; }
  .file .fw { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, #D00000 12%, transparent); }
  .file .fw svg { width: 17px; height: 17px; fill: color-mix(in srgb, #D00000, #fff var(--fw-lift, 0%)); }
  :root[data-theme="dark"] .file .fw svg { --fw-lift: 25%; }
  .file .w { display: flex; flex-direction: column; min-width: 0; }
  .file .w b { font: 500 13.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .w span { font-size: 12px; color: var(--muted); }
  .file.err { border-color: color-mix(in srgb, var(--down) 45%, var(--rule)); }
  .file .r { display: flex; align-items: center; gap: 6px; }
  .ul-drop { appearance: none; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 16px; border: 1.5px dashed color-mix(in srgb, var(--accent) 35%, var(--rule)); border-radius: 10px; background: var(--surface); color: inherit; font: inherit; text-align: center; cursor: pointer; transition: border-color 0.15s; }
  .ul-drop:hover { border-color: var(--accent); }
  .ul-drop .qi { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
  .ul-drop .qi .i { width: 18px; height: 18px; }
  .ul-drop b { font-weight: 600; }
  .ul-drop b code { font: 600 13.5px var(--mono); }
  .ul-drop span { font-size: 12.5px; color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .ul-p { display: flex; flex-direction: column; gap: 6px; }
  .ul-p .ln { display: flex; justify-content: space-between; gap: 10px; font: 12px var(--mono); color: var(--muted); }
  .ul-meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding-top: 12px; border-top: 1px solid var(--rule); }
  .ul-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .ul-meta .i { width: 13px; height: 13px; }
  .cks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .ck-r { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.4; }
  .ck-i { flex: none; width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; margin-top: 0; }
  .ck-i .i { width: 11px; height: 11px; stroke-width: 2.5; }
  .ck-r.ok .ck-i { background: var(--up-soft); color: var(--up); }
  .ck-r.no .ck-i { background: var(--surface2); }
  .ck-r.no { color: var(--muted); }
  .ck-r.err .ck-i { background: var(--down-soft); color: var(--down); }
  .ck-r.run .ck-i { border: 2px solid var(--accent); border-right-color: transparent; animation: spin 0.7s linear infinite; }
  .ck-r .s { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Review tools: the Screens menu, theme and Notes. Not part of the app. */
  .scr { position: fixed; left: 16px; bottom: 16px; z-index: 80; font-family: var(--sans); }
  .scr-t { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--rule)); background: var(--bg); color: var(--ink); font: 500 13px var(--sans); cursor: pointer; box-shadow: 0 6px 24px var(--shadow); }
  .scr-p { position: absolute; left: 0; bottom: calc(100% + 8px); width: 340px; max-height: calc(100vh - 90px); overflow: auto; padding: 8px; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); box-shadow: 0 12px 34px var(--shadow); }
  .scr-g { font: 500 10.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 10px 8px 4px; }
  .scr-o { appearance: none; display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border: 0; border-radius: 6px; background: none; color: var(--ink); font: 13px var(--sans); text-align: left; cursor: pointer; }
  .scr-o:hover { background: var(--surface); }
  .scr-o.on { background: var(--accent-soft); color: var(--accent); }
  .scr-o .k { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .scr-f { display: flex; gap: 6px; padding: 4px 4px 10px; border-bottom: 1px solid var(--rule); margin-bottom: 2px; }
  .scr-f .btn { flex: 1; }
  .notes { display: flex; flex-direction: column; gap: 16px; font-size: 13.5px; }
  .notes h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .notes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
  .notes li::marker { color: var(--muted); }
  .notes code { font: 12.5px var(--mono); background: var(--surface); padding: 1px 5px; border-radius: 4px; }

  @keyframes fx-in { from { opacity: 0; } }
  @keyframes fx-dlg { from { opacity: 0; transform: translateY(10px) scale(0.97); } }
  @keyframes fx-up { from { opacity: 0; transform: translateY(8px); } }

    return shell('Create API key', `<div class="fld"><label class="fld-l" for="kn"><span>Name</span><span class="cnt">${c.name.length} / 40</span></label><input id="kn" class="inp" data-input="kn" value="${esc(c.name)}" maxlength="40" placeholder="Claude Code on my laptop" autocomplete="off"><span class="hint">So you know where it is used</span></div>
      <div class="fld"><span class="fld-l"><span>What it can do</span></span>${scopeBox(SCOPES, c.sc, 'crSc', false)}</div>
      <div class="fld"><span class="fld-l"><span>Expires</span></span><div class="seg">${EXPIRY.map(([k, l]) => `<button type="button" class="${c.exp === k ? 'on' : ''}" data-act="crExp" data-val="${k}">${l}</button>`).join('')}</div><span class="hint">${e[2] ? `On ${e[2]}. Create a new key then.` : 'Works until you revoke it.'}</span></div>`,
      `<span class="hint">You see the key once, right after this</span><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn pri" data-act="go" data-val="#keys/shown">Create key</button>`, 'wide');
  },
  shown() {
    const [, code] = SNIPS[S.snip];
    return shell('Copy your new key', `<div class="note warn">${ic('warn')}<span class="t"><b>You will not see it again</b><span>Store it in a password manager or your app's secrets. Anyone with it can act as you.</span></span></div>
      <div class="fld"><span class="fld-l"><span>Claude Code on my laptop</span><span class="cnt">read · backtests · 90 days</span></span><div class="secret"><code>${NEW_KEY}</code>${copyBtn('key')}</div></div>
      <div class="fld"><span class="fld-l"><span>Try it</span></span><div class="seg">${Object.entries(SNIPS).map(([k, [l]]) => `<button type="button" class="${S.snip === k ? 'on' : ''}" data-act="snip" data-val="${k}">${l}</button>`).join('')}</div>
      <div class="snip"><pre>${code}</pre><button type="button" class="btn sm" data-act="copy" data-val="snip" aria-label="Copy" title="Copy">${ic(S.copied === 'snip' ? 'ok' : 'copy')}</button></div></div>`,
      `<a class="link" href="https://candlestack.tech/docs/api" target="_blank" rel="noopener" style="margin-right:auto">API guide${ic('ext')}</a><button type="button" class="btn pri" data-act="go" data-val="#keys">Done</button>`, 'wide');
  },
  revoke() {
    const list = S.keys === 'limit' ? [KEYS[0], KEYS[1], KEYS[2], ...MORE_KEYS] : KEYS, k = list[S.mk] || KEYS[1];
    const who = `<div class="who-k"><span class="kr-ic">${ic('key')}</span><span class="kr-m"><span class="kr-n"><b>${esc(k.name)}</b><code>${k.pre}…</code></span>${chips(k.sc)}</span></div>`;
    if (k.gone) return shell(`Delete ${esc(k.name)}?`, `${who}<p>It expired on ${k.exp} and no longer works. This removes it from the list.</p>`, '<button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn danger solid" data-act="close">Delete key</button>');
    return shell(`Revoke ${esc(k.name)}?`, `${who}<p>Anything that uses this key stops working at once. ${k.used ? `It was last used ${k.used.toLowerCase().startsWith('today') || k.used.toLowerCase().startsWith('yesterday') ? k.used.toLowerCase() : k.used}.` : 'It was never used.'}</p><p class="muted">This cannot be undone. You can create a new key any time.</p>`,
      '<button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn danger solid" data-act="close">Revoke key</button>');
  },
  disconnect() {
    const a = APPS[S.ma] || APPS[1];
    return shell(`Disconnect ${a.name}?`, `<div class="who-k"><span class="kr-ic app" aria-hidden="true">${a.ini}</span><span class="kr-m"><span class="kr-n"><b>${a.name}</b><span class="dom">${a.dom}</span></span>${chips(a.sc)}</span></div><p>${a.name} loses access to your account at once. Its chats keep what they already show.</p><p class="muted">You can connect it again from ${a.name} any time.</p>`,
      '<button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn danger solid" data-act="close">Disconnect</button>');
  },
  notes() {
    return shell('Notes for the review', `<div class="notes">
      <div><h3>API keys card</h3><ul>
        <li>One bordered row per key, like the providers of the Sign-in card. Name and the shown prefix <code>cs_7Hq2Lm9x…</code>, the scopes as mono chips, Last used over Created and Expires, Revoke.</li>
        <li>Expiring within 7 days is amber. An expired key stays in the list, greyed with an Expired tag and Delete, until removed. It does not count toward the 10.</li>
        <li>The count <code>3 of 10</code> sits next to Create key. At 10 the button is disabled with a tooltip and an amber note says to revoke one.</li>
        <li>Create key asks for a name (1 to 40 characters), the four scopes with <code>read</code> always on and an expiry of 30 days, 90 days (default), 1 year or Never.</li>
        <li>The key is shown once in its own dialog with Copy, an amber warning and Try it snippets (API, Claude Code, Cursor) with the key filled in. Done closes it. Copying is not required to close.</li>
        <li>Revoke and Delete ask first, in red. Keys are managed only here with the session, never with a key.</li>
      </ul></div>
      <div><h3>MCP card</h3><ul>
        <li>Server URL with Copy, then one line per client with its guide on <code>candlestack.tech/docs/mcp/&lt;client&gt;</code>. Clients get neutral letter tiles, not their logos.</li>
        <li>Connected apps lists only OAuth apps (Claude, ChatGPT). Claude Code and Cursor use a key, so they show under API keys.</li>
        <li>Disconnect asks first and ends the app's access at once.</li>
      </ul></div>
      <div><h3>Consent screen</h3><ul>
        <li>One card on the grid like the sign-in page. The app's tile, a link, the CandleStack mark. The title says who wants what. The app's site (claude.ai) is named, since anyone can register an app called Claude.</li>
        <li>Scopes in plain words with boxes. Read is always on, Run backtests and Manage models start on, Publish starts off. Cancel and Allow side by side.</li>
        <li>Signed out shows the sign-in buttons on the same card and comes back here. Not on the beta list reuses the sign-in page's words.</li>
      </ul></div>
      <div><h3>Upload page</h3><ul>
        <li>Signed in only. A signed-out visitor gets the normal sign-in page and returns here.</li>
        <li>Shows who asked (the app or the key's name), the expected file and size, the time left and what it takes from the storage.</li>
        <li>A file with another size is refused in the browser before sending, and the link stays usable.</li>
        <li>A failed check uses the link up, as the link is single use. The page says to ask for a new one.</li>
        <li>Expired, used and wrong account are short state cards with one way on.</li>
      </ul></div>
      <div><h3>Example data</h3><ul><li>Names, keys, dates and sizes are examples. The key on the Key shown once screen is not a real key.</li></ul></div>
    </div>`, '<button type="button" class="btn pri" data-act="close">Close</button>', 'xl');
  },
};

// ---------- the Screens menu (review tool) ----------
const SCREENS = [
  ['Settings, API keys', [['#keys', 'Keys list'], ['#keys/empty', 'No keys yet'], ['#keys/create', 'Create key dialog'], ['#keys/shown', 'Key shown once'], ['#keys/revoke', 'Revoke confirm'], ['#keys/delete', 'Delete an expired key'], ['#keys/limit', 'Limit of 10 reached']]],
  ['Settings, MCP server', [['#mcp', 'Connected apps'], ['#mcp/none', 'No apps connected'], ['#mcp/disconnect', 'Disconnect confirm']]],
  ['Consent screen', [['#consent', 'Allow access'], ['#consent/signed-out', 'Signed out'], ['#consent/denied', 'Not on the beta list']]],
  ['Upload page of a one-time link', [['#upload/ready', 'Ready'], ['#upload/wrong-file', 'A different file'], ['#upload/uploading', 'Uploading'], ['#upload/checking', 'Checking'], ['#upload/done', 'Done'], ['#upload/failed', 'Check failed'], ['#upload/expired', 'Link expired'], ['#upload/used', 'Link used'], ['#upload/wrong', 'Wrong account']]],
];
function scrMenu() {
  const items = SCREENS.map(([g, l]) => `<div class="scr-g">${g}</div>${l.map(([h, t]) => `<button type="button" class="scr-o ${S.hash === h ? 'on' : ''}" data-act="go" data-val="${h}">${t}<span class="k">${h}</span></button>`).join('')}`).join('');
  return `<div class="scr">${S.menu ? `<div class="scr-p" role="menu"><div class="scr-f"><button type="button" class="btn sm" data-act="theme">${ic(isDark() ? 'sun' : 'moon')}${isDark() ? 'Light' : 'Dark'}</button><button type="button" class="btn sm" data-act="notes">${ic('note')}Notes</button></div>${items}</div>` : ''}<button type="button" class="scr-t" data-act="menu" aria-expanded="${S.menu}" title="Every screen and state">${ic('grid')}Screens</button></div>`;
}

// ---------- render ----------
let lastPage = '';
function render() {
  const html = { settings: pageSettings, consent: pageConsent, upload: pageUpload }[S.page]();
  if (html !== lastPage) { document.getElementById('app').innerHTML = html; lastPage = html; }
  document.getElementById('ov').innerHTML = `${S.modal && MODALS[S.modal] ? MODALS[S.modal]() : ''}${scrMenu()}`;
  document.title = `${{ settings: 'Settings', consent: 'Allow access', upload: 'Upload a model' }[S.page]} · CandleStack`;
  S.anim = false;
  if (S.focus) { const el = document.getElementById(S.focus); S.focus = null; if (el) el.focus(); }
}

// ---------- routes: every screen starts from the same example data ----------
function route() {
  const h = location.hash || '#keys', [a, b] = h.slice(1).split('/');
  Object.assign(S, { hash: h, modal: null, menu: false, copied: '', keys: 'list', apps: 'some', snip: 'api', anim: true, mk: 1, ma: 1 });
  S.cr = { name: '', sc: { read: true, backtests: true, models: false, publish: false }, exp: '90' };
  S.cs = { read: true, backtests: true, models: true, publish: false };
  let scroll = 0;
  S.base = ['empty', 'limit', 'none'].includes(b) ? `#${a}/${b}` : `#${a}`;
  if (a === 'keys') {
    S.page = 'settings';
    if (b === 'empty') S.keys = 'empty';
    if (b === 'limit') S.keys = 'limit';
    if (b === 'create') { S.modal = 'create'; S.focus = 'kn'; }
    if (b === 'shown') S.modal = 'shown';
    if (b === 'revoke') S.modal = 'revoke';
    if (b === 'delete') { S.modal = 'revoke'; S.mk = 3; }
  } else if (a === 'mcp') {
    S.page = 'settings'; scroll = 'mcp-card';
    if (b === 'none') S.apps = 'none';
    if (b === 'disconnect') S.modal = 'disconnect';
  } else if (a === 'consent') {
    S.page = 'consent'; S.consent = b === 'signed-out' ? 'out' : b === 'denied' ? 'denied' : 'normal';
  } else if (a === 'upload') {
    S.page = 'upload'; S.up = b || 'ready';
  } else if (a === 'notes') {
    S.modal = 'notes';
  } else { S.page = 'settings'; }
  render();
  if (scroll) { const el = document.getElementById(scroll); if (el) el.scrollIntoView({ block: 'start' }); } else if (a !== 'notes') window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

// ---------- actions: moving between screens, nothing more ----------
const go = h => { if (location.hash === h) route(); else location.hash = h; };
const ACT = {
  go: (el, v) => { go(v); return false; },
  theme: () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; lastPage = ''; },
  menu: () => { S.menu = !S.menu; },
  notes: () => { S.modal = 'notes'; S.anim = true; S.menu = false; },
  // A dialog opened from the Screens menu closes to its page, one opened on the page just closes
  close: () => { if (S.base !== S.hash) { go(S.base); return false; } S.modal = null; },
  stay: () => false,
  copy: (el, v) => { S.copied = v; },
  snip: (el, v) => { S.snip = v; S.copied = ''; },
  revoke: (el, v) => { S.mk = +v; S.modal = 'revoke'; S.anim = true; },
  disconnect: (el, v) => { S.ma = +v; S.modal = 'disconnect'; S.anim = true; },
  crSc: (el, v) => { S.cr.sc[v] = !S.cr.sc[v]; },
  crExp: (el, v) => { S.cr.exp = v; },
  cs: (el, v) => { S.cs[v] = !S.cs[v]; lastPage = ''; },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.menu && !e.target.closest('.scr')) { S.menu = false; render(); } return; }
  const a = el.dataset.act;
  if (S.menu && !el.closest('.scr')) S.menu = false;
  if (!ACT[a]) { render(); return; }
  if (ACT[a](el, el.dataset.val) === false) return;
  render();
});
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.input === 'kn') { S.cr.name = e.target.value; const c = e.target.closest('.fld').querySelector('.cnt'); if (c) c.textContent = `${S.cr.name.length} / 40`; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.modal || S.menu)) { if (S.modal) ACT.close() !== false && render(); else { S.menu = false; render(); } }
});

route();
</script>
</body>
</html>
