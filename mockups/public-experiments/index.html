<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CandleStack · Public experiments · Final</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  /* Tokens: the approved app (design/mockups/app) and Compare (design/mockups/compare-backtests) */
  :root {
    --bg: #fafaf9; --ink: #141414; --muted: #686868; --rule: #e7e5e2; --accent: #0f766e;
    --warn: #a15c07; --down: #b42318; --up: #1a7f37; --candle-up: #2e9e44; --candle-down: #f23645;
    --grid: rgb(28 25 23 / 0.09); --shadow: rgb(0 0 0 / 0.08); --on-accent: #fafaf9; --tile: #ffffff;
    --s0: #1d5fd1; --s1: #b86e00; --s2: #7a4fd0; --s3: #3a3a3a; --fw-lift: 0%;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d0f11; --ink: #ecedee; --muted: #9ba1a6; --rule: #23272b; --accent: #3cc7a6;
    --warn: #e8b45a; --down: #f0616d; --up: #43b049; --candle-up: #43b049; --candle-down: #f23645;
    --grid: rgb(230 232 234 / 0.075); --shadow: rgb(0 0 0 / 0.5); --on-accent: #0d0f11; --tile: #ffffff;
    --s0: #5b9cf6; --s1: #f2a33c; --s2: #b794f6; --s3: #e8e8e8; --fw-lift: 25%;
    color-scheme: dark;
  }
  :root {
    --surface: color-mix(in srgb, var(--ink) 5%, var(--bg));
    --surface2: color-mix(in srgb, var(--ink) 9%, var(--bg));
    --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--bg));
    --up-soft: color-mix(in srgb, var(--up) 14%, transparent);
    --down-soft: color-mix(in srgb, var(--down) 14%, transparent);
    --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
  h1, h2, h3, p { margin: 0; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .ink { color: var(--ink); }
  .up { color: var(--up); } .down { color: var(--down); }
  .eyebrow { font: 500 11px/16px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); }
  .i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* The app frame */
  .frame { min-height: 100vh; display: flex; flex-direction: column;
    background-color: var(--bg);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px; }
  .frame > main { flex: 1; }
  .ahdr { position: relative; z-index: 30; padding: 0 24px; border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--bg) 88%, transparent); }
  .ahdr-in { max-width: 1152px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 20px; }
  .ahdr .sp { flex: 1; }
  .ahdr .r { display: flex; align-items: center; gap: 8px; }
  .home-link { appearance: none; border: 0; background: none; padding: 0; line-height: 0; border-radius: 6px; cursor: pointer; }
  .logo { height: 28px; width: 152px; display: block; }
  .lg-a { fill: var(--accent); } .lg-b { fill: var(--bg); } .lg-c { fill: var(--ink); }
  .avatar { width: 30px; height: 30px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; font: 600 12px var(--mono); flex: none; }
  .avatar.xs { width: 20px; height: 20px; font-size: 9px; letter-spacing: -0.02em; }
  .avatar.xxs { width: 16px; height: 16px; font-size: 7.5px; letter-spacing: -0.03em; }
  .avatar.md { width: 22px; height: 22px; font-size: 9px; }
  .avatar.lg { width: 40px; height: 40px; font-size: 14px; }
  .av-btn { appearance: none; border: 0; padding: 0; cursor: pointer; border-radius: 999px; line-height: 0; background: none; }
  .abody { max-width: 1200px; width: 100%; margin: 0 auto; padding: 28px 24px 40px; }
  .afoot { border-top: 1px solid var(--rule); background: var(--bg); }
  .afoot > div { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 12px; color: var(--muted); }
  .afoot .cred { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-left: auto; }
  .afoot u { text-underline-offset: 2px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); font: 500 14px var(--sans); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--surface); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.pri:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
  .btn.sm .i { width: 14px; height: 14px; }
  .btn.icon { width: 34px; padding: 0; }
  .btn.added { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .btn.added:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
  .ic { appearance: none; display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; flex: none; }
  .ic:hover { background: var(--surface2); color: var(--ink); }
  .link { appearance: none; border: 0; background: none; padding: 0; color: var(--accent); font: 500 13px var(--sans); cursor: pointer; text-decoration: none; text-align: left; }
  .link:hover { text-decoration: underline; text-underline-offset: 2px; }
  .back { appearance: none; border: 0; background: none; padding: 0; margin-bottom: 14px; color: var(--muted); font: 13px var(--sans); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .back:hover { color: var(--ink); }

  .card { background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; min-width: 0; }
  .ttl { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .ttl h1 { font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.025em; }
  .ttl p { color: var(--muted); margin-top: 4px; }
  .ttl-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sec-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .sec-h h2 { font-size: 16px; font-weight: 600; }
  .dd-h { display: flex; align-items: center; gap: 10px; }
  .dd-ic { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .dd-ic .i { width: 15px; height: 15px; }

  .badge { display: inline-block; font: 500 11px/16px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
  .badge.bad { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, var(--rule)); }
  /* New: the Public pill. Green, rounded, a globe in front. */
  .pub-pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px 0 6px; border-radius: 999px; font: 500 11px/1 var(--mono); color: var(--up); background: color-mix(in srgb, var(--up) 12%, var(--bg)); border: 1px solid color-mix(in srgb, var(--up) 40%, var(--rule)); white-space: nowrap; }
  .pub-pill .i { width: 11px; height: 11px; stroke-width: 2.2; }
  .glb { display: inline-grid; place-items: center; color: var(--accent); line-height: 0; }
  .glb .i { width: 14px; height: 14px; }

  /* Tables */
  .tblwrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { font-weight: 500; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tbl tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-family: var(--mono); }
  .tbl th.num { text-align: right; }
  .tbl tr.rl { cursor: pointer; }
  .tbl tr.rl:hover td { background: var(--surface); }
  .tbl tr.picked td { background: var(--accent-soft); }
  .tbl .sub { display: block; font: 11.5px var(--mono); color: var(--muted); }
  .tbl td.cc { width: 44px; padding: 3px 8px; text-align: center; }
  .rid { font: 500 13px var(--mono); }
  .chip { font: 500 11.5px var(--mono); padding: 1px 7px; border: 1px solid var(--rule); border-radius: 999px; background: var(--bg); color: var(--ink); white-space: nowrap; }
  .star { appearance: none; flex: none; width: 28px; height: 28px; margin: -4px -2px; display: inline-grid; place-items: center; border: 0; border-radius: 6px; background: none; padding: 0; cursor: pointer; color: color-mix(in srgb, var(--muted) 55%, var(--bg)); font-size: 19px; line-height: 1; }
  .star:hover { background: var(--surface); color: var(--warn); }
  .star.on { color: var(--warn); }
  .dd-sort { appearance: none; border: 0; background: none; padding: 0; font: inherit; font-weight: 500; color: inherit; cursor: pointer; white-space: nowrap; }
  .dd-sort:hover, .dd-sort.on { color: var(--ink); }
  .dd-sort.on { font-weight: 600; }
  .bt-m { display: inline-flex; align-items: center; gap: 7px; }
  .who { display: inline-flex; align-items: center; gap: 8px; }
  .you { color: var(--muted); font-size: 12px; font-weight: 400; }
  .fw-mini { width: 14px; height: 14px; fill: color-mix(in srgb, var(--fw), #fff var(--fw-lift)); flex: none; }
  .dd-fw { flex: none; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: color-mix(in srgb, var(--fw) 12%, transparent); }
  .dd-fw svg { width: 15px; height: 15px; fill: color-mix(in srgb, var(--fw), #fff var(--fw-lift)); }
  .dd-fw.sm { width: 20px; height: 20px; border-radius: 5px; } .dd-fw.sm svg { width: 11px; height: 11px; }
  .itile { flex: none; width: 28px; height: 28px; border-radius: 5px; background: var(--tile); box-shadow: inset 0 0 0 1px rgb(20 20 20 / 0.14); display: grid; place-items: center; }
  .itile i { width: 70%; height: 70%; border-radius: 4px; display: grid; place-items: center; color: #fff; font: 700 12px/1 var(--sans); font-style: normal; }
  .itile.sm { width: 18px; height: 18px; border-radius: 4px; } .itile.sm i { font-size: 8.5px; border-radius: 3px; }
  .itile.coin i { border-radius: 999px; }

  /* Compare's scale button */
  .cmpi { appearance: none; display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; flex: none; transition: color 0.12s, background-color 0.12s, border-color 0.12s, transform 0.12s; }
  .cmpi:hover { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
  .cmpi.on { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .cmpi:disabled { opacity: 0.3; cursor: not-allowed; color: var(--muted); background: none; border-color: transparent; }
  .idl { appearance: none; border: 0; padding: 0; background: none; font: 500 13px var(--mono); cursor: pointer; color: var(--ink); }
  .idl:hover { color: var(--accent); }

  /* Sidebar workspace (the live Sidebar.tsx) */
  .dd-ws { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: start; }
  .dd-main { min-width: 0; }
  .dd-side { display: flex; flex-direction: column; gap: 2px; padding: 8px; }
  .dd-nav { appearance: none; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: none; color: var(--muted); font: 14px var(--sans); cursor: pointer; text-align: left; white-space: nowrap; }
  .dd-nav:hover { color: var(--ink); background: var(--surface); }
  .dd-nav.on { color: var(--ink); background: var(--surface2); font-weight: 500; }
  .dd-nav .dd-n { margin-left: auto; padding-left: 8px; font: 400 12px var(--mono); color: var(--muted); }
  .dd-sfoot { margin-top: 10px; padding: 12px 10px 4px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; }
  .meter { display: block; height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .dd-s { font: 12px var(--mono); }

  /* Dashboard */
  .qa { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .qa-c { appearance: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); color: inherit; font: inherit; text-align: left; cursor: pointer; min-width: 0; }
  .qa-c:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); background: var(--surface); }
  .qa-c.pri { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--rule)); }
  .qa-c.pri .qa-i { background: var(--accent); color: var(--on-accent); }
  .qa-i { flex: none; width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--surface2); color: var(--ink); }
  .qa-i .i { width: 18px; height: 18px; }
  .qa-t { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .qa-t b { font-weight: 600; } .qa-t .h { font-size: 12.5px; color: var(--muted); }
  .dd-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 356px); gap: 16px; align-items: start; }
  .dd-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .dd-card { padding: 16px; min-width: 0; }
  .dd-card .tbl th, .dd-card .tbl td { padding-left: 10px; padding-right: 10px; }
  .dd-list { display: flex; flex-direction: column; }
  /* A widget row (StarredBacktests.tsx): lead, number and instrument, a 64 x 28 chart, return, compare; then the second line */
  .dd-sr { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) 64px auto 32px; column-gap: 8px; row-gap: 4px; align-items: center; width: 100%; padding: 8px 6px; border-radius: 6px; cursor: pointer; }
  .dd-sr:hover { background: var(--surface); }
  .dd-sr > .lead { grid-row: span 2; align-self: start; display: inline-grid; place-items: center; width: 22px; min-height: 22px; }
  .dd-sr > .lead .star { margin: -3px; }
  .dd-sr > .tail { grid-row: span 2; align-self: center; }
  .dd-sr > .dd-b2 { grid-column: 2 / 4; }
  .dd-b1 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .dd-b1 .tk { font: 11.5px var(--mono); }
  .dd-b2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .dd-b2 > span { overflow: hidden; text-overflow: ellipsis; }
  .dd-r1, .dd-r2 { text-align: right; white-space: nowrap; font-family: var(--mono); }
  .dd-r1 { font-size: 14px; font-weight: 600; }
  .dd-r2 { font-size: 11px; color: var(--muted); }
  .dd-more { appearance: none; width: 100%; margin-top: 6px; padding: 10px 6px 0; border: 0; border-top: 1px solid var(--rule); background: none; display: flex; justify-content: space-between; gap: 10px; font: 500 12.5px var(--sans); color: var(--muted); cursor: pointer; }
  .dd-more:hover { color: var(--ink); }
  .dd-best .dd-rk { width: 28px; color: var(--muted); font: 12px var(--mono); }
  .dd-best td.dd-on { font-weight: 600; }

  /* The mini chart (MiniChart.tsx): green above zero, red below, 18 % fill, dotted zero */
  .mini { display: block; width: 64px; height: 28px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); border-radius: 5px; pointer-events: none; }
  .mini svg, .xc-ch svg { display: block; width: 100%; height: 100%; }
  .mc-z { stroke: var(--muted); stroke-opacity: 0.6; stroke-width: 1; stroke-dasharray: 1 3; vector-effect: non-scaling-stroke; }
  .mc-b { fill: none; stroke: var(--muted); stroke-opacity: 0.7; stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
  .mc-u, .mc-d { fill: none; stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .mc-u { stroke: var(--up); } .mc-d { stroke: var(--down); }

  /* List pages: search, the Filters button and panel, pager (the Instruments page's) */
  .bt-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .bt-tools .sp { flex: 1; }
  .bt-q { position: relative; flex: 1 1 260px; max-width: 384px; min-width: 180px; }
  .bt-q .i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .inp { height: 36px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 10px; background: var(--bg); font: 14px var(--sans); color: var(--ink); width: 100%; min-width: 0; }
  .inp:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 55%, var(--rule)); }
  .bt-q .inp { padding-left: 36px; }
  .fp-w { position: relative; flex: none; }
  .fp-t { appearance: none; display: flex; align-items: center; gap: 8px; width: 200px; height: 34px; padding: 0 10px 0 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--muted); font: 14px var(--sans); text-align: left; cursor: pointer; }
  .fp-t:hover, .fp-t.open { color: var(--ink); }
  .fp-t.open { border-color: color-mix(in srgb, var(--accent) 55%, var(--rule)); }
  .fp-sum { flex: 1; min-width: 0; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fp-chev { color: var(--muted); transition: transform 0.15s; }
  .fp-t.open .fp-chev, .fchip.open .fp-chev { transform: rotate(180deg); }
  .fp { position: absolute; left: 0; top: calc(100% + 6px); z-index: 40; width: 412px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; padding: 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); box-shadow: 0 10px 28px var(--shadow); font-size: 14px; }
  .fp-h { margin-bottom: 8px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .fp-s [role=listbox] { margin: 0 -4px; display: flex; flex-direction: column; }
  .fp-o { appearance: none; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border: 0; border-radius: 4px; background: none; color: var(--ink); font: inherit; text-align: left; white-space: nowrap; cursor: pointer; width: 100%; }
  .fp-o:hover { background: var(--surface); }
  .fp-o > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 6px; }
  .fp-o.zero { color: var(--muted); }
  .fp-n { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
  .fp-n.sans { font-family: var(--sans); }
  .fp-ck { flex: none; color: var(--accent); visibility: hidden; }
  .fp-o.on .fp-ck { visibility: visible; }
  .fp-o.on { font-weight: 500; }
  .bt-card { overflow: hidden; }
  .bt-none { text-align: center; padding: 24px; }
  .pg { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
  .pg-l { appearance: none; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); font: 14px var(--sans); cursor: pointer; }
  .pg-l:hover { background: var(--surface); }
  .pg-l.off { opacity: 0.4; cursor: default; }
  .st-tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
  .st-tabs button { appearance: none; position: relative; padding: 9px 12px 11px; border: 0; background: none; color: var(--muted); font: 14px var(--sans); cursor: pointer; display: inline-flex; gap: 7px; align-items: baseline; }
  .st-tabs button:hover { color: var(--ink); }
  .st-tabs button.on { color: var(--ink); font-weight: 500; }
  .st-tabs button.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }

  .scr { position: fixed; left: 16px; bottom: 16px; z-index: 80; font-family: var(--sans); }
  .scr-t { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--rule)); background: var(--bg); color: var(--ink); font: 500 13px var(--sans); cursor: pointer; box-shadow: 0 6px 24px var(--shadow); }

  .notes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
  .notes li::marker { color: var(--muted); }
  .notes code { font: 12.5px var(--mono); background: var(--surface); padding: 1px 5px; border-radius: 4px; }

  /* Motion */
  @keyframes fx-fade { from { opacity: 0; } }
  @keyframes fx-dlg { from { opacity: 0; transform: translateY(10px) scale(0.97); } }
  @keyframes fx-pop { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
  @keyframes fx-up { from { opacity: 0; transform: translate(-50%, 8px); } }

    if (b === 'table-sharpe') S.e.sort = { k: 'sharpe', dir: 'desc' };
    if (b === 'table-p2') S.e.page = 2;
  }
  else if (a === 'run') {
    S.page = 'run'; S.key = `o${b}`; const r = byKey(S.key);
    if (c === 'private' || c === 'publish') r.pub = null;
    if ((c === 'public' || c === 'unpublish') && !r.pub) r.pub = [TODAY, '20:41'];
    if (c === 'publish' || c === 'unpublish') { S.modal = c; S.animM = true; }
    if (r.st === 'failed' && !prev) S.tipOpen = true;
  }
  else if (a === 'x') { S.page = 'x'; S.key = b; }
  else if (a === 'cmp') { S.page = 'cmp'; if (b === 'mix' || b === 'picker' || picks().length < 2) S.cmp = ['o13', 'o8', 'tt9', 'ma3']; if (b === 'picker') { S.cmp = ['o13', 'o8', 'tt9', null]; S.modal = 'picker'; S.pick = { tab: 'exp', q: '' }; S.animM = true; } }
  else if (a === 'panel') {
    S.page = 'exp'; S.e = EDEF(); S.view = 'cards'; S.trayMin = false;
    if (b === 'unpublished') { S.cmp = ['o8', 'tt9', 'vs57', null]; byKey('vs57').gone = true; } else S.cmp = ['o13', 'o8', 'tt9', null];
  }
  else if (a === 'notes') { if (!prev) S.page = 'dash'; S.modal = 'notes'; S.animM = true; }
  else if (['models', 'inst', 'settings'].includes(a)) S.page = a;
  else S.page = 'dash';
  const sec = SEC_LABEL[prev], detail = p => p === 'run' || p === 'x';
  if (detail(S.page)) {

}

  copy: () => { toast('Link copied. It opens only for people on the CandleStack beta.'); },
  star: (el, v) => { const b = byKey(v); b.star = !b.star; },
  cmp: (el, v) => { const i = S.cmp.indexOf(v); if (i >= 0) S.cmp[i] = null; else { const f = S.cmp.indexOf(null); if (f < 0) return false; S.cmp[f] = v; S.trayMin = false; } },
  cmpDrop: (el, v) => { const i = S.cmp.indexOf(v); if (i >= 0) S.cmp[i] = null; },
  cmpClear: () => { S.cmp = [null, null, null, null]; },
  trayMin: () => { S.trayMin = !S.trayMin; },
  pop: (el, v) => { S.pop = S.pop === v ? null : v; S.anim = true; },
  bF: (el, v) => { S.b.f = v; S.b.page = 1; }, bM: (el, v) => { S.b.m = v || null; S.b.page = 1; },
  bSort: (el, v) => { S.b.page = 1; const s = S.b.sort, first = v === 'model' ? 'asc' : 'desc', second = first === 'asc' ? 'desc' : 'asc'; S.b.sort = !s || s.k !== v ? { k: v, dir: first } : s.dir === first ? { k: v, dir: second } : null; },
  bPage: (el, v) => { S.b.page = +v; },
  bestBy: (el, v) => { S.best = v; },
  eTab: (el, v) => { S.e.tab = v; eReset(); },
  eView: (el, v) => { S.view = v; },
  eSet: (el, v) => { const k = el.dataset.k; S.e[k] = v; S.pop = null; eReset(); },
  eSortPick: (el, v) => { S.e.sort = v === 'pub' ? null : { k: v, dir: 'desc' }; S.pop = null; eReset(); },
  eSort: (el, v) => { eReset(); const s = S.e.sort; if (v === 'pub') { S.e.sort = !s ? { k: 'pub', dir: 'asc' } : null; return; } S.e.sort = !s || s.k !== v ? { k: v, dir: 'desc' } : s.dir === 'desc' ? { k: v, dir: 'asc' } : null; },
  eAuthorX: () => { S.e.author = null; eReset(); },
  eReset: () => { Object.assign(S.e, { mk: 'all', rep: 'all', tf: 'all', author: null, q: '' }); eReset(); },
  eClear: () => { Object.assign(S.e, { q: '', mk: 'all', rep: 'all', tf: 'all', author: null }); eReset(); },
  eMore: () => { S.e.shown += E_STEP; },
  ePage: (el, v) => { S.e.page = +v; window.scrollTo(0, 0); },
  byAuthor: (el, v) => { S.e = { ...EDEF(), author: v }; go('#exp'); return false; },
  pickTab: (el, v) => { S.pick.tab = v; S.pick.q = ''; },
  range: (el, v) => { S.range = v; },
  tradesSw: () => { S.trades = !S.trades; },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  const tip = S.tipOpen; S.tipOpen = false;
  if (!el) { let ch = tip; if (S.pop && !e.target.closest('[data-pop]')) { S.pop = null; ch = true; } if (S.menu && !e.target.closest('.scr')) { S.menu = false; ch = true; } if (ch) render(); return; }
  const a = el.dataset.act;
  if (S.pop && !el.closest('[data-pop]')) S.pop = null;
  if (S.menu && !el.closest('.scr')) S.menu = false;
  if (!ACT[a]) { render(); return; }
  const r = ACT[a](el, el.dataset.val);
  if (r === false) return;
  render();
});
const INPUT = {
  bq: el => { S.b.q = el.value; S.b.page = 1; },
  eq: el => { S.e.q = el.value; eReset(); },
  pq: el => { S.pick.q = el.value; },
};
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.input; if (k && INPUT[k]) { INPUT[k](e.target); live(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.modal || S.pop || S.menu)) { S.modal = null; S.pop = null; S.menu = false; render(); return; }
  const el = e.target; if ((e.key === 'Enter' || e.key === ' ') && el.matches && el.matches('[role="link"][data-act]')) { e.preventDefault(); el.click(); }
});

route();
</script>
