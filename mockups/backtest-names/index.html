<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CandleStack</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  /* Tokens: the approved app (design/mockups/app) and Compare (design/mockups/compare-backtests) */
  :root {
    --bg: #fafaf9; --ink: #141414; --muted: #686868; --rule: #e7e5e2; --accent: #0f766e;
    --warn: #a15c07; --down: #b42318; --up: #1a7f37; --candle-up: #2e9e44; --candle-down: #f23645;
    --grid: rgb(28 25 23 / 0.09); --shadow: rgb(0 0 0 / 0.08); --on-accent: #fafaf9; --tile: #ffffff;
    --s0: #1d5fd1; --s1: #b86e00; --s2: #7a4fd0; --s3: #3a3a3a; --fw-lift: 0%;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d0f11; --ink: #ecedee; --muted: #9ba1a6; --rule: #23272b; --accent: #3cc7a6;
    --warn: #e8b45a; --down: #f0616d; --up: #43b049; --candle-up: #43b049; --candle-down: #f23645;
    --grid: rgb(230 232 234 / 0.075); --shadow: rgb(0 0 0 / 0.5); --on-accent: #0d0f11; --tile: #ffffff;
    --s0: #5b9cf6; --s1: #f2a33c; --s2: #b794f6; --s3: #e8e8e8; --fw-lift: 25%;
    color-scheme: dark;
  }
  :root {
    --surface: color-mix(in srgb, var(--ink) 5%, var(--bg));
    --surface2: color-mix(in srgb, var(--ink) 9%, var(--bg));
    --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--bg));
    --up-soft: color-mix(in srgb, var(--up) 14%, transparent);
    --down-soft: color-mix(in srgb, var(--down) 14%, transparent);
    --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
  h1, h2, h3, p { margin: 0; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .ink { color: var(--ink); }
  .up { color: var(--up); } .down { color: var(--down); }
  .eyebrow { font: 500 11px/16px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); }
  .i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* The app frame */
  .frame { min-height: 100vh; display: flex; flex-direction: column;
    background-color: var(--bg);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px; }
  .frame > main { flex: 1; }
  .ahdr { position: relative; z-index: 30; padding: 0 24px; border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--bg) 88%, transparent); }
  .ahdr-in { max-width: 1152px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 20px; }
  .ahdr .sp { flex: 1; }
  .ahdr .r { display: flex; align-items: center; gap: 8px; }
  .home-link { appearance: none; border: 0; background: none; padding: 0; line-height: 0; border-radius: 6px; cursor: pointer; }
  .logo { height: 28px; width: 152px; display: block; }
  .lg-a { fill: var(--accent); } .lg-b { fill: var(--bg); } .lg-c { fill: var(--ink); }
  .avatar { width: 30px; height: 30px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; font: 600 12px var(--mono); flex: none; }
  .avatar.xs { width: 20px; height: 20px; font-size: 9px; letter-spacing: -0.02em; }
  .avatar.xxs { width: 16px; height: 16px; font-size: 7.5px; letter-spacing: -0.03em; }
  .avatar.md { width: 22px; height: 22px; font-size: 9px; }
  .avatar.lg { width: 40px; height: 40px; font-size: 14px; }
  .av-btn { appearance: none; border: 0; padding: 0; cursor: pointer; border-radius: 999px; line-height: 0; background: none; }
  .abody { max-width: 1200px; width: 100%; margin: 0 auto; padding: 28px 24px 40px; }
  .afoot { border-top: 1px solid var(--rule); background: var(--bg); }
  .afoot > div { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 12px; color: var(--muted); }
  .afoot .cred { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-left: auto; }
  .afoot u { text-underline-offset: 2px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); font: 500 14px var(--sans); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--surface); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.pri:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
  .btn.sm .i { width: 14px; height: 14px; }
  .btn.icon { width: 34px; padding: 0; }
  .btn.added { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .btn.added:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
  .ic { appearance: none; display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; flex: none; }
  .ic:hover { background: var(--surface2); color: var(--ink); }
  .link { appearance: none; border: 0; background: none; padding: 0; color: var(--accent); font: 500 13px var(--sans); cursor: pointer; text-decoration: none; text-align: left; }
  .link:hover { text-decoration: underline; text-underline-offset: 2px; }
  .back { appearance: none; border: 0; background: none; padding: 0; margin-bottom: 14px; color: var(--muted); font: 13px var(--sans); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .back:hover { color: var(--ink); }

  .card { background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; min-width: 0; }
  .ttl { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .ttl h1 { font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.025em; }
  .ttl p { color: var(--muted); margin-top: 4px; }
  .ttl-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sec-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .sec-h h2 { font-size: 16px; font-weight: 600; }
  .dd-h { display: flex; align-items: center; gap: 10px; }
  .dd-ic { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .dd-ic .i { width: 15px; height: 15px; }

  .badge { display: inline-block; font: 500 11px/16px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
  .badge.bad { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, var(--rule)); }
  /* New: the Public pill. Green, rounded, a globe in front. */
  .pub-pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px 0 6px; border-radius: 999px; font: 500 11px/1 var(--mono); color: var(--up); background: color-mix(in srgb, var(--up) 12%, var(--bg)); border: 1px solid color-mix(in srgb, var(--up) 40%, var(--rule)); white-space: nowrap; }
  .pub-pill .i { width: 11px; height: 11px; stroke-width: 2.2; }
  .glb { display: inline-grid; place-items: center; color: var(--accent); line-height: 0; }
  .glb .i { width: 14px; height: 14px; }

  /* Tables */
  .tblwrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { font-weight: 500; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tbl tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-family: var(--mono); }
  .tbl th.num { text-align: right; }
  .tbl tr.rl { cursor: pointer; }
  .tbl tr.rl:hover td { background: var(--surface); }
  .tbl tr.picked td { background: var(--accent-soft); }
  .tbl .sub { display: block; font: 11.5px var(--mono); color: var(--muted); }
  .tbl td.cc { width: 44px; padding: 3px 8px; text-align: center; }
  .rid { font: 500 13px var(--mono); }
  .chip { font: 500 11.5px var(--mono); padding: 1px 7px; border: 1px solid var(--rule); border-radius: 999px; background: var(--bg); color: var(--ink); white-space: nowrap; }
  .star { appearance: none; flex: none; width: 28px; height: 28px; margin: -4px -2px; display: inline-grid; place-items: center; border: 0; border-radius: 6px; background: none; padding: 0; cursor: pointer; color: color-mix(in srgb, var(--muted) 55%, var(--bg)); font-size: 19px; line-height: 1; }
  .star:hover { background: var(--surface); color: var(--warn); }
  .star.on { color: var(--warn); }
  .dd-sort { appearance: none; border: 0; background: none; padding: 0; font: inherit; font-weight: 500; color: inherit; cursor: pointer; white-space: nowrap; }
  .dd-sort:hover, .dd-sort.on { color: var(--ink); }
  .dd-sort.on { font-weight: 600; }
  .bt-m { display: inline-flex; align-items: center; gap: 7px; }
  .who { display: inline-flex; align-items: center; gap: 8px; }
  .you { color: var(--muted); font-size: 12px; font-weight: 400; }
  .fw-mini { width: 14px; height: 14px; fill: color-mix(in srgb, var(--fw), #fff var(--fw-lift)); flex: none; }
  .dd-fw { flex: none; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: color-mix(in srgb, var(--fw) 12%, transparent); }
  .dd-fw svg { width: 15px; height: 15px; fill: color-mix(in srgb, var(--fw), #fff var(--fw-lift)); }
  .dd-fw.sm { width: 20px; height: 20px; border-radius: 5px; } .dd-fw.sm svg { width: 11px; height: 11px; }
  .itile { flex: none; width: 28px; height: 28px; border-radius: 5px; background: var(--tile); box-shadow: inset 0 0 0 1px rgb(20 20 20 / 0.14); display: grid; place-items: center; }
  .itile i { width: 70%; height: 70%; border-radius: 4px; display: grid; place-items: center; color: #fff; font: 700 12px/1 var(--sans); font-style: normal; }
  .itile.sm { width: 18px; height: 18px; border-radius: 4px; } .itile.sm i { font-size: 8.5px; border-radius: 3px; }
  .itile.coin i { border-radius: 999px; }

  /* Compare's scale button */
  .cmpi { appearance: none; display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; flex: none; transition: color 0.12s, background-color 0.12s, border-color 0.12s, transform 0.12s; }
  .cmpi:hover { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
  .cmpi.on { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .cmpi:disabled { opacity: 0.3; cursor: not-allowed; color: var(--muted); background: none; border-color: transparent; }
  .idl { appearance: none; border: 0; padding: 0; background: none; font: 500 13px var(--mono); cursor: pointer; color: var(--ink); }
  .idl:hover { color: var(--accent); }

  /* Sidebar workspace (the live Sidebar.tsx) */
  .dd-ws { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: start; }
  .dd-main { min-width: 0; }
  .dd-side { display: flex; flex-direction: column; gap: 2px; padding: 8px; }
  .dd-nav { appearance: none; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: none; color: var(--muted); font: 14px var(--sans); cursor: pointer; text-align: left; white-space: nowrap; }
  .dd-nav:hover { color: var(--ink); background: var(--surface); }
  .dd-nav.on { color: var(--ink); background: var(--surface2); font-weight: 500; }
  .dd-nav .dd-n { margin-left: auto; padding-left: 8px; font: 400 12px var(--mono); color: var(--muted); }
  .dd-sfoot { margin-top: 10px; padding: 12px 10px 4px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; }
  .meter { display: block; height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .dd-s { font: 12px var(--mono); }

  /* Dashboard */
  .qa { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .qa-c { appearance: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); color: inherit; font: inherit; text-align: left; cursor: pointer; min-width: 0; }
  .qa-c:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); background: var(--surface); }
  .qa-c.pri { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--rule)); }
  .qa-c.pri .qa-i { background: var(--accent); color: var(--on-accent); }
  .qa-i { flex: none; width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--surface2); color: var(--ink); }
  .qa-i .i { width: 18px; height: 18px; }
  .qa-t { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .qa-t b { font-weight: 600; } .qa-t .h { font-size: 12.5px; color: var(--muted); }
  .dd-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 356px); gap: 16px; align-items: start; }
  .dd-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .dd-card { padding: 16px; min-width: 0; }
  .dd-card .tbl th, .dd-card .tbl td { padding-left: 10px; padding-right: 10px; }
  .dd-list { display: flex; flex-direction: column; }
  /* A widget row (StarredBacktests.tsx): lead, number and instrument, a 64 x 28 chart, return, compare; then the second line */
  .dd-sr { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) 64px auto 32px; column-gap: 8px; row-gap: 4px; align-items: center; width: 100%; padding: 8px 6px; border-radius: 6px; cursor: pointer; }
  .dd-sr:hover { background: var(--surface); }
  .dd-sr > .lead { grid-row: span 2; align-self: start; display: inline-grid; place-items: center; width: 22px; min-height: 22px; }
  .dd-sr > .lead .star { margin: -3px; }
  .dd-sr > .tail { grid-row: span 2; align-self: center; }
  .dd-sr > .dd-b2 { grid-column: 2 / 4; }
  .dd-b1 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .dd-b1 .tk { font: 11.5px var(--mono); }
  .dd-b2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .dd-b2 > span { overflow: hidden; text-overflow: ellipsis; }
  .dd-r1, .dd-r2 { text-align: right; white-space: nowrap; font-family: var(--mono); }
  .dd-r1 { font-size: 14px; font-weight: 600; }
  .dd-r2 { font-size: 11px; color: var(--muted); }
  .dd-more { appearance: none; width: 100%; margin-top: 6px; padding: 10px 6px 0; border: 0; border-top: 1px solid var(--rule); background: none; display: flex; justify-content: space-between; gap: 10px; font: 500 12.5px var(--sans); color: var(--muted); cursor: pointer; }
  .dd-more:hover { color: var(--ink); }
  .dd-best .dd-rk { width: 28px; color: var(--muted); font: 12px var(--mono); }
  .dd-best td.dd-on { font-weight: 600; }

  /* The mini chart (MiniChart.tsx): green above zero, red below, 18 % fill, dotted zero */
  .mini { display: block; width: 64px; height: 28px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); border-radius: 5px; pointer-events: none; }
  .mini svg, .xc-ch svg { display: block; width: 100%; height: 100%; }
  .mc-z { stroke: var(--muted); stroke-opacity: 0.6; stroke-width: 1; stroke-dasharray: 1 3; vector-effect: non-scaling-stroke; }
  .mc-b { fill: none; stroke: var(--muted); stroke-opacity: 0.7; stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
  .mc-u, .mc-d { fill: none; stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .mc-u { stroke: var(--up); } .mc-d { stroke: var(--down); }

  /* List pages: search, the Filters button and panel, pager (the Instruments page's) */
  .bt-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .bt-tools .sp { flex: 1; }
  .bt-q { position: relative; flex: 1 1 260px; max-width: 384px; min-width: 180px; }
  .bt-q .i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .inp { height: 36px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 10px; background: var(--bg); font: 14px var(--sans); color: var(--ink); width: 100%; min-width: 0; }
  .inp:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 55%, var(--rule)); }
  .bt-q .inp { padding-left: 36px; }
  .fp-w { position: relative; flex: none; }
  .fp-t { appearance: none; display: flex; align-items: center; gap: 8px; width: 200px; height: 34px; padding: 0 10px 0 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--muted); font: 14px var(--sans); text-align: left; cursor: pointer; }
  .fp-t:hover, .fp-t.open { color: var(--ink); }
  .fp-t.open { border-color: color-mix(in srgb, var(--accent) 55%, var(--rule)); }
  .fp-sum { flex: 1; min-width: 0; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fp-chev { color: var(--muted); transition: transform 0.15s; }
  .fp-t.open .fp-chev, .fchip.open .fp-chev { transform: rotate(180deg); }
  .fp { position: absolute; left: 0; top: calc(100% + 6px); z-index: 40; width: 412px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; padding: 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); box-shadow: 0 10px 28px var(--shadow); font-size: 14px; }
  .fp-h { margin-bottom: 8px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .fp-s [role=listbox] { margin: 0 -4px; display: flex; flex-direction: column; }
  .fp-o { appearance: none; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border: 0; border-radius: 4px; background: none; color: var(--ink); font: inherit; text-align: left; white-space: nowrap; cursor: pointer; width: 100%; }
  .fp-o:hover { background: var(--surface); }
  .fp-o > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 6px; }
  .fp-o.zero { color: var(--muted); }
  .fp-n { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
  .fp-n.sans { font-family: var(--sans); }
  .fp-ck { flex: none; color: var(--accent); visibility: hidden; }
  .fp-o.on .fp-ck { visibility: visible; }
  .fp-o.on { font-weight: 500; }
  .bt-card { overflow: hidden; }
  .bt-none { text-align: center; padding: 24px; }
  .pg { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
  .pg-l { appearance: none; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); font: 14px var(--sans); cursor: pointer; }
  .pg-l:hover { background: var(--surface); }
  .pg-l.off { opacity: 0.4; cursor: default; }
  .st-tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
  .st-tabs button { appearance: none; position: relative; padding: 9px 12px 11px; border: 0; background: none; color: var(--muted); font: 14px var(--sans); cursor: pointer; display: inline-flex; gap: 7px; align-items: baseline; }
  .st-tabs button:hover { color: var(--ink); }
  .st-tabs button.on { color: var(--ink); font-weight: 500; }
  .st-tabs button.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }

  .bcell .bn { font-weight: 500; color: var(--ink); max-width: 210px; }

  .dd-card .tbl th, .dd-card .tbl td { padding-left: 8px; padding-right: 8px; }
  .ex-t .bcell .bn { max-width: 160px; }
  .dd-card .bcell .bn { max-width: 150px; }
  /* Names take room the number did not. Model, author and When may wrap, as the live app's model column and dashboard already do. */
  .bt-t:not(.ex-t) td.c-model, .ex-t td.c-auth { white-space: normal; }
  .ex-t th, .ex-t td { padding-left: 7px; padding-right: 7px; }
  .ex-t .c-auth .who { min-width: 112px; }
  .bt-t .c-model .bt-m { align-items: flex-start; }
  .bt-t .c-model .fw-mini { margin-top: 2px; }
  .dd-card .tbl td.c-when { white-space: normal; }
  /* Dashboard widget rows: the name on line 1, instrument · representation · timeframe on line 2 */
  .dd-b1 .bn { font-weight: 500; font-size: 13px; }
  .dd-b2 .bsub { font-size: 11.5px; }
  /* Card title: tile, name, the line under it */
  .xc-tt { display: flex; flex-direction: column; min-width: 0; }
  .xc-tt h2 { font-size: 15px; line-height: 20px; }
  .xc .dd-h { align-items: center; }
  .xc-m .xc-in { margin-left: 2px; }
  .xc-m span.xc-in { overflow: visible; }
  /* The backtest page title: up to two lines, then an ellipsis */
  .r7-t { flex: 1 1 420px; min-width: 0; flex-wrap: nowrap; align-items: flex-start; }
  .r7-t h1 { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
  .r7-t .r7-id { flex: none; font: 400 13px/28px var(--mono); color: var(--muted); }
  .r7-t .badge, .r7-t .pub-pill { flex: none; margin-top: 5px; }
  .r7-t .pub-pill { margin-top: 4px; }
  .r7-hd { align-items: flex-start; }
  .r7-hd .acts { padding-top: 0; }
  .r3-sub .rt { color: var(--muted); font-weight: 400; }
  /* Compare: names in the panel, the column heads and the legends */

  .nmb:hover { color: var(--accent); }
  .tw { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .tw .bsub { font-size: 11px; line-height: 15px; }
  .cmp-h .t { min-width: 0; }
  .cmp-h .nmb { font-size: 14px; line-height: 20px; }
  .cmp-h .bsub { margin: 1px 0 0 18px; font-size: 12px; }
  .cmp-h .a { margin-left: 18px; }
  .ch-lg { gap: 6px 16px; }
  .ch-lg > span { display: inline-flex; align-items: flex-start; gap: 7px; max-width: 168px; min-width: 0; }

  .lg-t { display: flex; flex-direction: column; min-width: 0; }

  .lg-t .bsub { font-size: 11px; line-height: 15px; }
  .pk-n { display: flex; align-items: center; gap: 6px; min-width: 0; }

  .mdl-h h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who-bt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface); min-width: 0; }

  .fld-l .cnt { font: 400 11.5px var(--mono); color: var(--muted); }

  .rn-gen b { color: var(--ink); font-weight: 500; }
  .rn-gen .link { font-size: 12.5px; }

  .ntip { position: fixed; z-index: 90; max-width: 360px; padding: 7px 10px; border-radius: 6px; background: var(--ink); color: var(--bg); font: 500 12.5px/1.4 var(--sans); white-space: normal; overflow-wrap: anywhere; box-shadow: 0 8px 24px var(--shadow); pointer-events: none; }

  @keyframes fx-fade { from { opacity: 0; } }

// ---------- equity curves (the compare page, the cards, the dashboard rows) ----------
function bridge(rnd, n, end, vol) { const w = [0]; for (let i = 1; i < n; i++) w.push(w[i - 1] + gauss(rnd) * vol); const L = Math.log(1 + end), W = w[n - 1]; return w.map((x, i) => Math.exp(x - W * i / (n - 1) + L * i / (n - 1))); }
const CN = 140;
const CSER = {}, BSER = {};
function cser(b) {
  if (CSER[b.key]) return CSER[b.key];
  // A slow swing for the deep drawdowns, a little noise on top, from 0 to the result
  const r = mulberry(hashStr(b.key) + 99), dd = Math.abs(b.dd) / 100, f = 1.4 + r() * 1.6, ph = r() * 6.28;
  const noise = bridge(r, CN, 0, dd / Math.sqrt(CN) * 0.55);
  const wave = Array.from({ length: CN }, (_, i) => Math.sin(i / (CN - 1) * 6.283 * f + ph) * dd * 0.55);
  const L = Math.log(1 + b.ret / 100);
  const e = noise.map((v, i) => Math.exp(Math.log(v) + wave[i] - wave[0] - (wave[CN - 1] - wave[0]) * i / (CN - 1) + L * i / (CN - 1)));
  let pk = 1; const fall = e.map(v => { pk = Math.max(pk, v); return v / pk - 1; });
  return CSER[b.key] = { eq: e.map(v => v - 1), fall };
}
const bser = b => BSER[b.bench] || (BSER[b.bench] = bridge(mulberry(hashStr(b.bench) + 3), CN, b.benchRet / 100, 0.011).map(v => v - 1));
// The mini chart: the strategy's return on a baseline at zero, as MiniChart.tsx draws it. The cards add the benchmark, dashed.
function mini(b, o = {}) {
  const W = o.w || 280, H = o.h || 44, id = `mc-${o.id || b.key}`;
  const s = cser(b).eq.map(v => v * 100), m = o.bench ? bser(b).map(v => v * 100) : [];
  let lo = Math.min(0, ...s, ...m), hi = Math.max(0, ...s, ...m); const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad;
  const x = i => (i / (CN - 1) * W).toFixed(1), y = v => ((hi - v) / (hi - lo) * H).toFixed(2), y0 = y(0);
  const line = a => a.map((v, i) => `${i ? 'L' : 'M'}${x(i)} ${y(v)}`).join('');
  const area = `${line(s)}L${W} ${y0}L0 ${y0}Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs>
    <linearGradient id="${id}-gu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${y0}"><stop offset="0" style="stop-color:var(--up);stop-opacity:.18"/><stop offset="1" style="stop-color:var(--up);stop-opacity:0"/></linearGradient>
    <linearGradient id="${id}-gd" gradientUnits="userSpaceOnUse" x1="0" y1="${y0}" x2="0" y2="${H}"><stop offset="0" style="stop-color:var(--down);stop-opacity:0"/><stop offset="1" style="stop-color:var(--down);stop-opacity:.18"/></linearGradient>
    <clipPath id="${id}-cu"><rect x="0" y="-2" width="${W}" height="${(+y0 + 2).toFixed(2)}"/></clipPath><clipPath id="${id}-cd"><rect x="0" y="${y0}" width="${W}" height="${(H - y0 + 2).toFixed(2)}"/></clipPath></defs>
    <line class="mc-z" x1="0" x2="${W}" y1="${y0}" y2="${y0}"/>${o.bench ? `<path class="mc-b" d="${line(m)}"/>` : ''}
    <g clip-path="url(#${id}-cu)"><path d="${area}" fill="url(#${id}-gu)"/><path class="mc-u" d="${line(s)}"/></g>
    <g clip-path="url(#${id}-cd)"><path d="${area}" fill="url(#${id}-gd)"/><path class="mc-d" d="${line(s)}"/></g></svg>`;
}

// ---------- example series for a backtest page ----------
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const p2 = n => String(n).padStart(2, '0');
const fmtT = t => { const d = new Date(t * 1000); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}<br>${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; };
const fmtP = v => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const SET = {};
function series(b) {
  if (SET[b.key]) return SET[b.key];
  const rnd = mulberry(hashStr(b.key) + 7), I = INSTR[b.inst], m = MODELS[b.model], crypto = I[1] === 'crypto';
  const tfSec = { '30m': 1800, '1h': 3600, '4h': 14400, '1d': 86400 }[m.tf];
  const times = [], d0 = Date.UTC(2025, 0, 2) / 1000, d1 = Date.UTC(2025, 8, 30) / 1000;
  for (let day = d0; day <= d1; day += 86400) {
    const wd = new Date(day * 1000).getUTCDay();
    if (!crypto && (wd === 0 || wd === 6)) continue;
    if (tfSec === 86400) { times.push(day); continue; }
    if (crypto) for (let s = 0; s < 86400; s += tfSec) times.push(day + s);
    else for (let s = 9.5 * 3600; s <= 15.5 * 3600; s += tfSec) times.push(day + s);
  }
  const n = times.length, volB = (crypto ? 0.006 : 0.004) * Math.sqrt(tfSec / 3600);
  const path = bridge(rnd, n, b.bh / 100, volB), p0 = I[3] / (1 + b.bh / 100), bars = [];
  for (let i = 0; i < n; i++) {
    const c = p0 * path[i], o = i ? bars[i - 1].close : c * (1 - gauss(rnd) * volB * 0.3);
    const h = Math.max(o, c) * (1 + Math.abs(gauss(rnd)) * volB * 0.45), l = Math.min(o, c) * (1 - Math.abs(gauss(rnd)) * volB * 0.45);
    bars.push({ time: times[i], open: o, high: h, low: l, close: c, volume: (crypto ? 900 : 2.6e6) * (0.6 + Math.abs(gauss(rnd))) });
  }
  const trades = [], k = b.trades, span = n / k, longOnly = b.pos === 'Long only';
  for (let j = 0; j < k; j++) {
    const o = Math.min(n - 2, Math.floor(j * span + rnd() * span * 0.2)), x = Math.min(n - 1, Math.max(o + 1, Math.floor((j + 1) * span) - (longOnly ? 1 + Math.floor(rnd() * span * 0.5) : 0)));
    const side = longOnly ? 1 : (rnd() < 0.5 ? 1 : -1), ret = side * (bars[x].close / bars[o].open - 1);
    trades.push({ o, x, side, ret, why: j === k - 1 ? 'end' : rnd() < 0.1 ? 'stop' : 'signal' });
  }
  const eq = bridge(mulberry(hashStr(b.key) + 11), n, b.ret / 100, volB * 0.75).map(v => (v - 1) * 100);
  const bench = bridge(mulberry(hashStr(b.bench) + 3), n, b.benchRet / 100, volB * 0.6).map(v => (v - 1) * 100);
  return SET[b.key] = { bars, trades, eq, bench, tfSec };
}

      <div><h3>Old backtests</h3><ul>
        <li>A migration gives every existing backtest a generated name, account by account, oldest first, unique in the account. Numbers do not change.</li></ul></div>
      <div><h3>The word lists</h3><ul>
        <li>Space and stars. 128 adjectives and 128 nouns, 16,384 names per account. Nouns are stars, constellations, planets, moons, comets and words like Nebula or Orbit.</li>
        <li>Short words that are easy to read and say. No adjective judges a result (no Lucky, Winning, Losing) and none could offend.</li>
        <li>20 adjectives: ${ADJ.join(', ')}.</li>
        <li>20 nouns: ${NOUN.join(', ')}.</li></ul></div>
      <div><h3>Sizes</h3><ul>
        <li>Tables. Name Geist 13 px 500, cut at 150 px in Backtests and on the Dashboard, 160 px in Experiments. Number Geist Mono 11.5 px muted, 6 px after the name.</li>
        <li>A name is wider than #13, so the tables give a little. Cells are 8 px from the side in Backtests and on the Dashboard, 7 px in Experiments (was 10 px). In Backtests a long model name may wrap, in Experiments the author’s name does, and When wraps on the Dashboard, as in the live app now.</li>
        <li>Dashboard widget rows. The name is 13 px 500 and gets about 90 px beside the mini chart, so longer names end in an ellipsis there. The author is the avatar, with the name and the day in a tooltip.</li>
        <li>Compare picker. 680 px wide (was 560 px), so names and Author · model both fit.</li>
        <li>Card title. Name 15 px 600 on 20 px, the second line under it, beside the 28 px instrument tile. The Representation and Timeframe badges go, the second line has them. What the model reads (in 25 × 3) moves next to the model.</li>
        <li>Page title. Name 22 px 600, up to two lines, then the number, the status badge and the Public pill on the first line.</li>
        <li>Compare panel. 264 px wide (was 248), each slot 44 px high with two lines, name 13 px 600 and the second line 11 px.</li></ul></div></div>`, '<button type="button" class="btn pri" data-act="close">Close</button>', 'wide');
  },
};

// ---------- Rename ----------
const NAME_MAX = 80;
function rnErr(b) {
  const t = S.rn.v.trim();
  if (!t) return 'A name can’t be empty.';
  const twin = OWN.find(x => x !== b && bname(x).toLowerCase() === t.toLowerCase());
  return twin ? `You already have a backtest called ${esc(bname(twin))} (#${twin.id}). Pick another name.` : '';
}
const rnCount = () => `${S.rn.v.trim().length} / ${NAME_MAX}`;
const rnOk = b => !rnErr(b) && S.rn.v.trim() !== bname(b);
function rnHint(b) {
  const t = S.rn.v.trim(), err = rnErr(b);
  const gen = t === b.gen ? '<div class="rn-gen"><span>This is the name CandleStack gave it. Type your own, you can come back to this one later.</span></div>'
    : `<div class="rn-gen"><span>Generated name <b>${esc(b.gen)}</b></span><button type="button" class="link" data-act="rnGen">Use the generated name</button></div>`;
  return `${err ? `<div class="rn-err" role="alert"><span class="dot"></span><span>${err}</span></div>` : ''}${gen}`;
}
const rnSaveBtn = b => `<button type="button" class="btn pri" data-act="rnSave" ${rnOk(b) ? '' : 'disabled'}>Save</button>`;

// ---------- the Screens menu (review tool) ----------
const SCREENS = [
  ['Dashboard', [['#dash', 'Dashboard, names in every widget']]],
  ['Your backtests', [['#runs/all', 'Backtests list'], ['#run/13/public', 'Silent Orion, yours, published'], ['#run/13/rename', 'Rename dialog'], ['#run/13/rename-taken', 'Rename, the name is taken'], ['#run/13/publish', 'Publish dialog'], ['#run/13/unpublish', 'Unpublish dialog'], ['#run/13/toast', 'Toast after publishing']]],
  ['Experiments', [['#exp/cards', 'Cards'], ['#exp/table', 'Table']]],
  ['Someone else’s backtest', [['#x/tt9', 'Velvet Deneb by Tymur']]],
  ['Compare', [['#panel', 'Compare panel'], ['#cmp/mix', 'Compare page'], ['#cmp/picker', 'Picker, Experiments tab'], ['#panel/unpublished', 'Panel, a slot was unpublished'], ['#cmp/unpublished', 'Page, a backtest was unpublished']]],
  ['A long custom name', [['#long/list', 'In the Backtests list'], ['#long/page', 'On the backtest page'], ['#long/card', 'On a card']]],
  ['Notes', [['#notes', 'Where two lines, where one, rules']]],
];
function scrMenu() {
  const items = SCREENS.map(([g, l]) => `<div class="scr-g">${g}</div>${l.map(([h, t]) => `<button type="button" class="scr-o ${S.hash === h ? 'on' : ''}" data-act="jump" data-val="${h}">${t}<span class="k">${h}</span></button>`).join('')}`).join('');
  return `<div class="scr">${S.menu ? `<div class="scr-p" role="menu"><div class="scr-f"><button type="button" class="btn sm" data-act="theme">${ic(isDark() ? 'sun' : 'moon')}${isDark() ? 'Light' : 'Dark'}</button><button type="button" class="btn sm" data-act="modal" data-val="notes">${ic('note')}Notes</button></div>${items}</div>` : ''}<button type="button" class="scr-t" data-act="menu" aria-expanded="${S.menu}" title="Every screen and state">${ic('grid')}Screens</button></div>`;
}

// ---------- render ----------
let lastPage = '';
function pageHtml() {
  const main = { dash: pageDash, runs: pageRuns, exp: pageExp, run: pageBt, x: pageBt, cmp: pageCmp, models: () => pagePlain('Models', '4 models · 26.4 MB of 100 MB used'), inst: () => pagePlain('Instruments', 'Stocks and crypto you can backtest'), settings: () => pagePlain('Settings', 'Your account and how new backtests start') }[S.page]();
  return `${header()}<main class="abody">${main}</main>${footer()}`;
}
function render() {
  const html = pageHtml();
  if (html !== lastPage) {
    const old = document.getElementById('pt-chart');
    if (old && LWC && LWC.el === old) old.remove();
    document.getElementById('app').innerHTML = html; lastPage = html; mountChart();
  }
  document.body.classList.toggle('has-tray', S.page !== 'cmp' && S.cmp.some(Boolean));
  document.getElementById('ov').innerHTML = `${tray()}${S.modal && MODALS[S.modal] ? MODALS[S.modal]() : ''}${S.toast ? `<div class="toast" role="status">${ic('ok')}${S.toast}</div>` : ''}${scrMenu()}`;
  S.anim = false; S.animM = false;
  // The browser tab: the backtest's name on its page
  const tb = (S.page === 'run' || S.page === 'x') && byKey(S.key);
  document.title = `${tb ? bname(tb) : { dash: 'Dashboard', runs: 'Backtests', exp: 'Experiments', cmp: 'Compare', models: 'Models', inst: 'Instruments', settings: 'Settings' }[S.page]} · CandleStack`;
  hideTip();
  if (S.forceTip) { const k = S.forceTip; document.fonts.ready.then(() => requestAnimationFrame(() => { const el = document.querySelector(`#app .bn[data-k="${k}"]`); if (el && S.forceTip === k) showTip(el); })); }
  if (S.focusRn) { S.focusRn = false; const el = document.getElementById('rn-in'); if (el) { el.focus(); el.select(); } }
}
// The full name of a cut name, on hover or focus
const NTIP = document.createElement('div'); NTIP.className = 'ntip'; NTIP.setAttribute('role', 'tooltip'); NTIP.hidden = true; document.body.appendChild(NTIP);
const isCut = el => el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;
function showTip(el) {
  if (!isCut(el)) { hideTip(); return; }
  NTIP.textContent = el.textContent; NTIP.hidden = false;
  const r = el.getBoundingClientRect(), w = NTIP.offsetWidth, x = Math.min(Math.max(8, r.left), innerWidth - w - 8);
  NTIP.style.left = `${x}px`; NTIP.style.top = `${r.bottom + 8}px`;
  NTIP.style.setProperty('--ax', `${Math.max(10, Math.min(w - 18, r.left + 14 - x))}px`);
}
function hideTip() { NTIP.hidden = true; }
const nameEl = t => t && t.closest ? t.closest('.bn, .bn2') : null;
document.addEventListener('mouseover', e => { const el = nameEl(e.target); if (el) showTip(el); else hideTip(); });
document.addEventListener('focusin', e => { const el = nameEl(e.target) || (e.target.querySelector && e.target.matches('[role="link"]') ? e.target.querySelector('.bn') : null); if (el) showTip(el); else hideTip(); });
addEventListener('wheel', hideTip, { passive: true });
function live() { document.querySelectorAll('[data-live]').forEach(el => { const f = LIVE[el.dataset.live]; if (f) el.innerHTML = f(); }); lastPage = pageHtml(); }
const LIVE = { rnc: rnCount, rnh: () => rnHint(byKey(S.key)), rnf: () => rnSaveBtn(byKey(S.key)), bt: bTable, bn: bCount, bp: () => pager(bRows().length, S.b.page, 'bPage'), eb: eBody, pk: () => { const m = document.createElement('div'); m.innerHTML = MODALS.picker(); const l = m.querySelector('.pk-list'); return l ? l.innerHTML : ''; } };
let toastT = 0;
function toast(t, ms = 2800) { S.toast = t; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; render(); }, ms); }

// ---------- routes ----------
const SEC_LABEL = { dash: ['#dash', 'Dashboard'], runs: ['#runs', 'Backtests'], exp: ['#exp', 'Experiments'], cmp: ['#cmp', 'Compare'] };
function route() {
  const h = location.hash || '#dash', [a, b, c] = h.slice(1).split('/');
  if (S.jump || !S.booted) { resetData(); S.cmp = ['o8', 'tt9', null, null]; S.trayMin = false; }
  const prev = S.booted && !S.jump ? S.page : null; S.booted = true; S.jump = false;
  S.hash = h; S.modal = null; S.pop = null; S.menu = false; S.tipOpen = false; S.forceTip = null;
  if (a === 'runs') { S.page = 'runs'; if (b === 'all') S.b = BDEF(); if (b === 'public') S.b = { ...BDEF(), f: 'pub' }; }
  else if (a === 'exp') {
    S.page = 'exp';
    if (b) { S.e = EDEF(); S.view = b.startsWith('table') ? 'table' : 'cards'; }
    if (b === 'cards-filtered') Object.assign(S.e, { mk: 'crypto', sort: { k: 'ret', dir: 'desc' } });
    if (b === 'cards-chip') { S.pop = 'mk'; S.anim = true; }
    if (b === 'cards-more') S.e.shown = E_STEP * 2;
    if (b === 'mine' || b === 'mine-empty') S.e.tab = 'mine';
    if (b === 'mine-empty') OWN.forEach(x => { x.pub = null; });
    if (b === 'none') S.e.q = 'dogecoin';
    if (b === 'by-tt') S.e.author = 'tt';
    if (b === 'table-sharpe') S.e.sort = { k: 'sharpe', dir: 'desc' };
    if (b === 'table-p2') S.e.page = 2;
  }
  else if (a === 'run') {
    S.page = 'run'; S.key = `o${b}`; const r = byKey(S.key);
    if (c === 'private' || c === 'publish') r.pub = null;
    if (['public', 'unpublish', 'rename', 'rename-taken', 'toast'].includes(c) && !r.pub) r.pub = [TODAY, '20:41'];
    if (c === 'publish' || c === 'unpublish') { S.modal = c; S.animM = true; }
    if (c === 'rename') { S.modal = 'rename'; S.animM = true; S.rn = { v: 'AAPL Kagi baseline, long and short' }; }
    if (c === 'rename-taken') { S.modal = 'rename'; S.animM = true; S.rn = { v: 'Bright Vega' }; }
    if (c === 'toast') toast(`${esc(bname(r))} is in Experiments now`, 6000);
    if (r.st === 'failed' && !prev) S.tipOpen = true;
  }
  else if (a === 'x') { S.page = 'x'; S.key = b; }
  else if (a === 'long') {
    // One backtest renamed to a long custom name
    byKey('o6').custom = LONG_NAME;
    if (b === 'page') { S.page = 'run'; S.key = 'o6'; }
    else if (b === 'card') { S.page = 'exp'; S.e = { ...EDEF(), tab: 'mine' }; S.view = 'cards'; S.forceTip = 'o6'; }
    else { S.page = 'runs'; S.b = BDEF(); S.forceTip = 'o6'; }
  }
  else if (a === 'cmp') { S.page = 'cmp'; if (b === 'unpublished') { S.cmp = ['o13', 'o8', 'tt9', 'vs57']; byKey('vs57').gone = true; } else if (b === 'mix' || b === 'picker' || picks().length < 2) S.cmp = ['o13', 'o8', 'tt9', 'ma3']; if (b === 'picker') { S.cmp = ['o13', 'o8', 'tt9', null]; S.modal = 'picker'; S.pick = { tab: 'exp', q: '' }; S.animM = true; } }
  else if (a === 'panel') {
    S.page = 'exp'; S.e = EDEF(); S.view = 'cards'; S.trayMin = false;
    if (b === 'unpublished') { S.cmp = ['o8', 'tt9', 'vs57', null]; byKey('vs57').gone = true; } else S.cmp = ['o13', 'o8', 'tt9', null];
  }
  else if (a === 'notes') { if (!prev) S.page = 'dash'; S.modal = 'notes'; S.animM = true; }
  else if (['models', 'inst', 'settings'].includes(a)) S.page = a;
  else S.page = 'dash';
  const sec = SEC_LABEL[prev], detail = p => p === 'run' || p === 'x';
  if (detail(S.page)) {
    if (sec) S.from = { hash: sec[0], label: sec[1] };
    else if (!detail(prev)) S.from = null;
    S.lastDetail = `#${a}/${b}`; S.lastKey = S.key;
  } else if (S.page === 'cmp') {
    if (sec && prev !== 'cmp') S.from = { hash: sec[0], label: sec[1] };
    else if (detail(prev)) S.from = { hash: S.lastDetail, label: esc(bname(byKey(S.lastKey))) };
    else if (prev !== 'cmp') S.from = null;
  } else if (a !== 'notes') S.from = null;
  render(); if (a !== 'notes') window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

// ---------- actions ----------
const go = h => { if (location.hash === h) route(); else location.hash = h; };
const eReset = () => { S.e.page = 1; S.e.shown = E_STEP; };
const ACT = {
  go: (el, v) => { go(v); return false; },
  jump: (el, v) => { S.jump = true; go(v); return false; },
  open: (el, v) => { const b = byKey(v); go(b.own ? `#run/${b.id}` : `#x/${v}`); return false; },
  theme: () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; lastPage = ''; },
  menu: () => { S.menu = !S.menu; },
  modal: (el, v) => { S.modal = v; S.animM = true; S.menu = false; if (v === 'picker') S.pick = { tab: 'mine', q: '' }; },
  close: () => { S.modal = null; },
  stay: () => false,
  publish: () => { const b = byKey(S.key); b.pub = [TODAY, '20:41']; S.modal = null; toast(`${esc(bname(b))} is in Experiments now`); },
  unpublish: () => { const b = byKey(S.key); b.pub = null; S.modal = null; toast(`${esc(bname(b))} left Experiments`); },
  rename: () => { const b = byKey(S.key); S.rn = { v: bname(b) }; S.modal = 'rename'; S.animM = true; S.focusRn = true; },
  rnGen: () => { S.rn.v = byKey(S.key).gen; S.focusRn = true; },
  rnSave: () => {
    const b = byKey(S.key), t = S.rn.v.trim(); if (!rnOk(b)) return false;
    const back = t === b.gen; b.custom = back ? null : t; S.modal = null;
    toast(back ? `Back to the generated name, ${esc(b.gen)}` : `Renamed to ${esc(t)}`);
  },
  copy: () => { toast('Link copied. It opens only for people on the CandleStack beta.'); },
  star: (el, v) => { const b = byKey(v); b.star = !b.star; },
  cmp: (el, v) => { const i = S.cmp.indexOf(v); if (i >= 0) S.cmp[i] = null; else { const f = S.cmp.indexOf(null); if (f < 0) return false; S.cmp[f] = v; S.trayMin = false; } },
  cmpDrop: (el, v) => { const i = S.cmp.indexOf(v); if (i >= 0) S.cmp[i] = null; },
  cmpClear: () => { S.cmp = [null, null, null, null]; },
  trayMin: () => { S.trayMin = !S.trayMin; },
  pop: (el, v) => { S.pop = S.pop === v ? null : v; S.anim = true; },
  bF: (el, v) => { S.b.f = v; S.b.page = 1; }, bM: (el, v) => { S.b.m = v || null; S.b.page = 1; },
  bSort: (el, v) => { S.b.page = 1; const s = S.b.sort, first = v === 'model' || v === 'id' ? 'asc' : 'desc', second = first === 'asc' ? 'desc' : 'asc'; S.b.sort = !s || s.k !== v ? { k: v, dir: first } : s.dir === first ? { k: v, dir: second } : null; },
  bPage: (el, v) => { S.b.page = +v; },
  bestBy: (el, v) => { S.best = v; },
  eTab: (el, v) => { S.e.tab = v; eReset(); },
  eView: (el, v) => { S.view = v; },
  eSet: (el, v) => { const k = el.dataset.k; S.e[k] = v; S.pop = null; eReset(); },
  eSortPick: (el, v) => { S.e.sort = v === 'pub' ? null : { k: v, dir: 'desc' }; S.pop = null; eReset(); },
  eSort: (el, v) => { eReset(); const s = S.e.sort; if (v === 'pub') { S.e.sort = !s ? { k: 'pub', dir: 'asc' } : null; return; } S.e.sort = !s || s.k !== v ? { k: v, dir: 'desc' } : s.dir === 'desc' ? { k: v, dir: 'asc' } : null; },
  eAuthorX: () => { S.e.author = null; eReset(); },
  eReset: () => { Object.assign(S.e, { mk: 'all', rep: 'all', tf: 'all', author: null, q: '' }); eReset(); },
  eClear: () => { Object.assign(S.e, { q: '', mk: 'all', rep: 'all', tf: 'all', author: null }); eReset(); },
  eMore: () => { S.e.shown += E_STEP; },
  ePage: (el, v) => { S.e.page = +v; window.scrollTo(0, 0); },
  byAuthor: (el, v) => { S.e = { ...EDEF(), author: v }; go('#exp'); return false; },
  pickTab: (el, v) => { S.pick.tab = v; S.pick.q = ''; },
  range: (el, v) => { S.range = v; },
  tradesSw: () => { S.trades = !S.trades; },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  const tip = S.tipOpen; S.tipOpen = false;
  if (!el) { let ch = tip; if (S.pop && !e.target.closest('[data-pop]')) { S.pop = null; ch = true; } if (S.menu && !e.target.closest('.scr')) { S.menu = false; ch = true; } if (ch) render(); return; }
  const a = el.dataset.act;
  if (S.pop && !el.closest('[data-pop]')) S.pop = null;
  if (S.menu && !el.closest('.scr')) S.menu = false;
  if (!ACT[a]) { render(); return; }
  const r = ACT[a](el, el.dataset.val);
  if (r === false) return;
  render();
});
const INPUT = {
  bq: el => { S.b.q = el.value; S.b.page = 1; },
  eq: el => { S.e.q = el.value; eReset(); },
  pq: el => { S.pick.q = el.value; },
  rn: el => { S.rn.v = el.value; el.classList.toggle('bad', !!rnErr(byKey(S.key))); },
};
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.input; if (k && INPUT[k]) { INPUT[k](e.target); live(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.modal || S.pop || S.menu)) { S.modal = null; S.pop = null; S.menu = false; render(); return; }
  const el = e.target;
  if (e.key === 'Enter' && el.id === 'rn-in') { e.preventDefault(); if (ACT.rnSave() !== false) render(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && el.matches && el.matches('[role="link"][data-act]')) { e.preventDefault(); el.click(); }
});

route();
</script>
