<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Docs · CandleStack</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  /* Tokens: website/src/styles/global.css. Series colors: the approved Compare (design/mockups/compare-backtests) */
  :root {
    --bg: #fafaf9; --ink: #141414; --muted: #686868; --rule: #e7e5e2; --accent: #0f766e;
    --warn: #a15c07; --up: #0f766e; --down: #b42318; --grid: rgb(28 25 23 / 0.045);
    --shadow: rgb(0 0 0 / 0.08); --on-accent: #fafaf9;
    --s0: #1d5fd1; --s1: #b86e00; --s2: #7a4fd0; --s3: #8a8a8a;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d0f11; --ink: #ecedee; --muted: #9ba1a6; --rule: #23272b; --accent: #3cc7a6;
    --warn: #e8b45a; --up: #3cc7a6; --down: #f0616d; --grid: rgb(230 232 234 / 0.045);
    --shadow: rgb(0 0 0 / 0.5); --on-accent: #0d0f11;
    --s0: #5b9cf6; --s1: #f2a33c; --s2: #b794f6; --s3: #7d848a;
    color-scheme: dark;
  }
  :root {
    --surface: color-mix(in srgb, var(--ink) 4%, var(--bg));
    --surface2: color-mix(in srgb, var(--ink) 8%, var(--bg));
    --code: color-mix(in srgb, var(--ink) 3%, var(--bg));
    --accent-soft: color-mix(in srgb, var(--accent) 11%, var(--bg));
    --warn-soft: color-mix(in srgb, var(--warn) 11%, var(--bg));
    --down-soft: color-mix(in srgb, var(--down) 11%, var(--bg));
    --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
    --hdr: 60px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: calc(var(--hdr) + 16px); }
  body { margin: 0; min-height: 100vh; background-color: var(--bg);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px; color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Site header: the website's header (brand, nav, theme toggle), full width on docs pages */
  .top { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); }
  .top-in { max-width: 1280px; margin: 0 auto; padding: 0 24px; height: var(--hdr); display: flex; align-items: center; gap: 16px; }
  .brand { font-weight: 600; font-size: 17px; }
  .brand-sl { color: var(--rule); font-weight: 400; margin: 0 2px; }
  .brand-docs { font-weight: 500; font-size: 15px; color: var(--muted); }
  .nav { margin-left: auto; display: flex; align-items: center; gap: 24px; font-size: 15px; }
  .nav a { color: var(--muted); }
  .nav a:hover, .nav a.on { color: var(--ink); }
  .toggle { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin: 0 -6px 0 0; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
  .toggle:hover { color: var(--ink); }
  .toggle .i { width: 17px; height: 17px; stroke-width: 2; }

  /* Docs grid: sidebar, page, contents */
  .docs { max-width: 1280px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: 232px minmax(0, 1fr) 200px; gap: 48px; align-items: start; }
  .side { position: sticky; top: var(--hdr); max-height: calc(100vh - var(--hdr)); overflow: auto; padding: 28px 4px 32px 0; scrollbar-width: thin; }
  .side-g { font: 500 11px/16px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 20px 10px 6px; }
  .side-g:first-child { padding-top: 0; }
  .side-l { display: block; padding: 5px 10px; border-radius: 6px; font-size: 14.5px; line-height: 1.4; color: var(--muted); }
  .side-l:hover { color: var(--ink); background: var(--surface); }
  .side-l.on { color: var(--ink); background: var(--surface2); font-weight: 500; }
  .side-f { margin-top: 24px; padding: 14px 10px 0; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; font: 12px var(--mono); color: var(--muted); }
  .side-f a:hover { color: var(--accent); }
  .side-site { display: none; }

  .pg { min-width: 0; max-width: 720px; padding: 40px 0 96px; }
  .crumbs { font: 12px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
  .crumbs i { font-style: normal; color: var(--rule); }
  .pg h1 { margin-top: 14px; font-size: 38px; line-height: 1.12; font-weight: 600; letter-spacing: -0.025em; }
  .pg h1.code-h { font-family: var(--mono); font-size: 32px; letter-spacing: -0.02em; }
  .intro { margin-top: 14px; font-size: 17px; line-height: 1.6; color: var(--muted); }
  .pact { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pmeta { font: 12px var(--mono); color: var(--muted); margin-left: 4px; }
  .pg h2 { margin: 48px 0 0; padding-top: 22px; border-top: 1px solid var(--rule); font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; position: relative; }
  .pg h2 .hlink, .pg h3 .hlink { margin-left: 8px; color: var(--muted); opacity: 0; font-weight: 400; }
  .pg h2:hover .hlink, .pg h3:hover .hlink { opacity: 1; }
  .pg h3 { margin: 28px 0 0; font-size: 17px; line-height: 1.4; font-weight: 600; }
  .pg p { margin-top: 12px; font-size: 16px; line-height: 1.65; }
  .pg h2 + p, .pg h3 + p { margin-top: 10px; }
  .pg p a, .pg li a, .rows a .t a { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 3px; }
  .pg code { font: 13.5px var(--mono); background: var(--surface); border: 1px solid var(--rule); padding: 0 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .small { font-size: 14px !important; color: var(--muted); }

  .toc { position: sticky; top: var(--hdr); max-height: calc(100vh - var(--hdr)); overflow: auto; padding: 44px 0 32px; }
  .toc-t { font: 500 11px/16px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .toc a { display: block; padding: 4px 0 4px 12px; border-left: 1px solid var(--rule); font-size: 13.5px; line-height: 1.4; color: var(--muted); }
  .toc a.sub { padding-left: 24px; font-family: var(--mono); font-size: 12.5px; }
  .toc a:hover { color: var(--ink); }
  .toc a.on { color: var(--accent); border-left-color: var(--accent); }
  .toc-x { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted); }
  .toc-x a { border: 0; padding: 0; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); font: 500 13.5px var(--sans); cursor: pointer; white-space: nowrap; transition: background-color .15s, border-color .15s, color .15s; }
  .btn:hover { background: var(--surface); color: var(--ink); }
  .btn:disabled { opacity: 0.45; cursor: default; background: var(--bg); }
  .btn .i { width: 15px; height: 15px; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.pri:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); color: var(--on-accent); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface2); }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn.xs { height: 26px; padding: 0 8px; font-size: 12.5px; gap: 5px; }
  .btn.xs .i { width: 13px; height: 13px; }
  .btn.done, .btn.done:hover { color: var(--accent); }

  /* Code block with a label or tabs, and Copy */
  .cb { margin: 16px 0 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--code); overflow: hidden; }
  .cb-hd { display: flex; align-items: center; gap: 2px; min-height: 38px; padding: 0 6px 0 4px; border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--ink) 2%, var(--bg)); }
  .cb-lbl { font: 12px var(--mono); color: var(--muted); padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cb-tabs { display: flex; align-self: stretch; overflow-x: auto; scrollbar-width: none; }
  .cb-tab { appearance: none; border: 0; background: none; padding: 0 10px; height: 38px; font: 500 13px var(--sans); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap; }
  .cb-tab:hover { color: var(--ink); }
  .cb-tab.on { color: var(--ink); border-bottom-color: var(--accent); }
  .cb-sp { flex: 1; }
  .cb pre { margin: 0; padding: 14px 16px; overflow: auto; font: 13px/1.65 var(--mono); tab-size: 2; color: var(--ink); }
  .cb.out pre { color: var(--muted); }
  .t-s { color: var(--accent); }
  .t-n { color: var(--warn); }
  .t-c { color: var(--muted); font-style: italic; }
  .t-k { color: var(--s0); }

  /* Prompt to copy */
  .prompt { margin: 16px 0 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); overflow: hidden; }
  .prompt .cb-hd { background: var(--accent-soft); }
  .prompt-l { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--mono); color: var(--accent); padding: 0 8px; }
  .prompt p { margin: 0 !important; padding: 14px 16px; font-size: 16px; line-height: 1.6; }

  /* Callouts */
  .co { margin: 18px 0 0; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--rule)); background: var(--accent-soft); font-size: 15px; line-height: 1.6; }
  .co .i { margin-top: 3px; color: var(--accent); }
  .co b { font-weight: 600; }
  .co.warn { border-color: color-mix(in srgb, var(--warn) 32%, var(--rule)); background: var(--warn-soft); }
  .co.warn .i { color: var(--warn); }

  /* Website rows: a label column and text, rule on top */
  .rows { margin: 14px 0 0; padding: 0; list-style: none; }
  .rows li > *, .rows li.r { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; padding: 11px 0; border-top: 1px solid var(--rule); font-size: 15px; line-height: 1.55; }
  .rows .l { color: var(--muted); }
  .rows .l.mono { font-size: 13px; padding-top: 2px; color: var(--ink); }
  .rows a:hover .l, .rows a:hover .t { color: var(--accent); }
  .rows a .t::after { content: " →"; color: var(--muted); }

  /* Numbered steps, the website's numbered rows */
  .steps { margin: 14px 0 0; padding: 0; list-style: none; counter-reset: st; }
  .steps > li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 16px 0 4px; border-top: 1px solid var(--rule); }
  .steps > li > .n { font: 13px/26px var(--mono); color: var(--muted); }
  .steps .s-t { font-size: 16px; font-weight: 600; line-height: 26px; }
  .steps .s-b > :first-child { margin-top: 4px; }
  .steps .s-b > *:last-child { margin-bottom: 12px; }
  .steps .s-b p { margin-top: 6px; }

  /* Where a screenshot goes */
  .shot { margin: 14px 0 0; aspect-ratio: 16 / 7; max-height: 230px; width: 100%; border: 1.5px dashed color-mix(in srgb, var(--muted) 45%, var(--rule)); border-radius: 8px; display: grid; place-items: center; text-align: center; padding: 16px; background: color-mix(in srgb, var(--bg) 70%, transparent); }
  .shot div { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 380px; }
  .shot .i { width: 22px; height: 22px; color: var(--muted); }
  .shot b { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .shot span { font-size: 13.5px; color: var(--muted); }

  /* Tabs (clients) */
  .tabs { margin: 18px 0 0; display: flex; gap: 4px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
  .tab { appearance: none; display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; height: 42px; padding: 0 12px; font: 500 14.5px var(--sans); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }
  .tab-meta { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .oneclick { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; font-size: 14px; color: var(--muted); }

  /* Tags */
  .tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font: 500 11.5px var(--mono); white-space: nowrap; border: 1px solid var(--rule); color: var(--muted); background: var(--bg); }
  .tag .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
  .tag.ro { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .tag.rw { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .tag.de { color: var(--down); background: var(--down-soft); border-color: transparent; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  /* Server address */
  .srv { margin: 22px 0 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
  .srv .k { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); grid-column: 1 / -1; }
  .srv .v { font: 500 16px var(--mono); overflow-wrap: anywhere; }
  .srv .h { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }

  /* Agents landing: MCP or the API */
  .pick { margin: 16px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 8px; }
  .card .k { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .card h3 { margin: 0; font-size: 17px; }
  .card p { margin: 0 !important; font-size: 14.5px !important; color: var(--muted); line-height: 1.55; }
  .card ul { margin: 4px 0 6px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .card li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; }
  .card li .i { width: 14px; height: 14px; margin-top: 3px; color: var(--accent); }
  .card .go { margin-top: auto; font-size: 14px; font-weight: 500; color: var(--accent); }
  .card .clients { display: flex; flex-wrap: wrap; gap: 6px; }

  /* Tables */
  .tw { margin: 14px 0 0; overflow-x: auto; }
  table.pt { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.5; }
  .pt th { text-align: left; font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 12px 8px 0; }
  .pt td { border-top: 1px solid var(--rule); padding: 10px 12px 10px 0; vertical-align: top; }
  .pt td.nm { font: 500 13px var(--mono); white-space: nowrap; }
  .pt td.nm small { display: block; font: 11.5px var(--mono); color: var(--muted); font-weight: 400; margin-top: 2px; }
  .pt td.ty { font: 12.5px var(--mono); color: var(--muted); white-space: nowrap; }
  .pt td.num, .pt th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pt .best { color: var(--up); font-weight: 600; }
  .pt .worst { color: var(--down); font-weight: 600; }
  .pt tr.bench td { color: var(--muted); }

  /* Tool reference */
  .tidx { margin: 14px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
  .tidx-g { padding: 12px 0 10px; border-top: 1px solid var(--rule); }
  .tidx-g .gt { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .tidx-g ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 1px; }
  .tidx-g a { display: inline-flex; align-items: center; gap: 8px; font: 13px/24px var(--mono); color: var(--muted); }
  .tidx-g a.has { color: var(--ink); }
  .tidx-g a:hover { color: var(--accent); }
  .tdot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
  .tdot.ro { background: var(--accent); } .tdot.rw { background: var(--warn); } .tdot.de { background: var(--down); }
  .legend { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .tool { margin-top: 48px; padding-top: 22px; border-top: 1px solid var(--rule); }
  .tool h2 { margin: 0 !important; padding: 0 !important; border: 0 !important; font: 600 22px var(--mono) !important; letter-spacing: -0.01em !important; }
  .tool .tags { margin-top: 10px; }
  .tool .lbl { margin-top: 22px; font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .tool .lbl + .cb, .tool .lbl + .tw { margin-top: 8px; }

  /* Use case: meta, session, outcome */
  .ucm { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px 16px; font: 12.5px var(--mono); color: var(--muted); }
  .ucm span { display: inline-flex; align-items: center; gap: 6px; }
  .ucm .i { width: 14px; height: 14px; }
  .sbar { margin: 16px 0 0; position: sticky; top: calc(var(--hdr) + 8px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); box-shadow: 0 6px 20px var(--shadow); }
  .seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--surface2); }
  .seg button { appearance: none; border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 5px; font: 500 13px var(--sans); color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }
  .sbar .sp { flex: 1; }
  .sbar .pos { font: 12.5px var(--mono); color: var(--muted); min-width: 84px; text-align: center; }
  .prog { display: flex; gap: 3px; width: 100%; padding: 0 2px; }
  .prog i { flex: 1; height: 3px; border-radius: 2px; background: var(--surface2); }
  .prog i.on { background: var(--accent); }
  .ss { margin: 18px 0 0; padding: 0; list-style: none; }
  .st { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; padding-bottom: 18px; }
  .st::before { content: ""; position: absolute; left: 13.5px; top: 30px; bottom: 2px; width: 1px; background: var(--rule); }
  .st:last-child::before { display: none; }
  .st-n { width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--rule); background: var(--bg); display: grid; place-items: center; font: 500 12px var(--mono); color: var(--muted); }
  .st.cur .st-n { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .st-b { min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 2px; }
  .who { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .st-say { margin: 0 !important; font-size: 15.5px !important; line-height: 1.6 !important; }
  .st.fin .st-say { font-size: 16px !important; }
  .st.fin .st-b { padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--rule)); border-radius: 10px; background: var(--accent-soft); }
  .tc { border: 1px solid var(--rule); border-radius: 8px; background: var(--code); overflow: hidden; }
  .tc-h { appearance: none; width: 100%; display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 6px 10px; border: 0; background: none; text-align: left; cursor: pointer; font: 13px var(--mono); }

const NPTS = 120;
(function buildSeries() {
  let seed = 11;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647 - 0.5; };
  SERIES.forEach(s => {
    s.v = [];
    for (let i = 0; i < NPTS; i++) {
      const t = i / (NPTS - 1);
      let j = 0; while (j < s.a.length - 2 && s.a[j + 1][0] < t) j++;
      const [t0, v0] = s.a[j], [t1, v1] = s.a[j + 1];
      const f = (t - t0) / (t1 - t0);
      const wob = Math.sin(Math.PI * f) * rnd() * (s.k === 'bh' ? 5 : s.k === 'win' ? 3.4 : 1.6);
      s.v.push(v0 + (v1 - v0) * f + wob);
    }
  });
})();

function langBlock(step) {

function argLine(a) { return Object.entries(a).map(([k, v]) => `${k} ${Array.isArray(v) ? v.length + ' ids' : v}`).join(', ') || 'no arguments'; }
function toolCall(c, key, open) {

function session() {
  const n = SESSION.length;
  if (S.mode === 'nojs') {
    // Without JavaScript: every step open in plain HTML, no controls
    return `<ol class="ss">${SESSION.map((s, i) => `<li class="st ${s.fin ? 'fin' : ''}"><div class="st-n">${i + 1}</div><div class="st-b">${s.say ? `<div class="who">${s.fin ? 'Agent’s answer' : 'Agent'}</div><p class="st-say">${esc(s.say)}</p>` : ''}${(s.calls || []).map(c => `<details class="nj" open><summary><b>${c.name}</b> <span class="muted">→ ${esc(c.res)}</span></summary><div class="tl">Call</div><pre>${hl(J(c.args), 'json')}</pre><div class="tl">Answer</div><pre>${hl(J(c.answer), 'json')}</pre></details>`).join('')}</div></li>`).join('')}</ol>`;
  }
  const all = S.mode === 'all';
  const shown = all ? n : S.step;
  const bar = `<div class="sbar"><div class="seg" role="tablist"><button type="button" class="${all ? '' : 'on'}" data-act="mode" data-val="step">Step by step</button><button type="button" class="${all ? 'on' : ''}" data-act="mode" data-val="all">All steps</button></div><span class="sp"></span>
    ${all ? `<span class="pos">${n} steps · ${CALLS} calls</span>` : `<button type="button" class="btn sm" data-act="prev" ${S.step <= 1 ? 'disabled' : ''} aria-label="Previous step">${ic('left')}<span class="hide-xs">Previous</span></button><span class="pos">Step ${S.step} of ${n}</span><button type="button" class="btn pri" data-act="next" ${S.step >= n ? 'disabled' : ''}>Next${ic('right')}</button>`}

  const items = SESSION.slice(0, shown).map((s, i) => {
    const cur = !all && i === S.step - 1;
    return `<li class="st ${cur ? 'cur' : ''} ${s.fin ? 'fin' : ''}"><div class="st-n">${i + 1}</div><div class="st-b">${s.say ? `<div class="who">${s.fin ? 'Agent’s answer' : 'Agent'}</div><p class="st-say">${esc(s.say)}</p>` : ''}${(s.calls || []).map((c, j) => { const key = `${i}-${j}`; const open = S.open[key] !== undefined ? S.open[key] : (all || cur); return toolCall(c, key, open); }).join('')}</div></li>`;
  }).join('');
  const more = !all && shown < n ? `<li class="st-more"><div class="st-n">${ic('down')}</div><div class="t">${n - shown} more ${n - shown === 1 ? 'step' : 'steps'}<button type="button" class="btn sm" data-act="mode" data-val="all">Show all</button></div></li>` : '';
  return `${bar}<ol class="ss">${items}${more}</ol>`;
}
function chart() {
  const lo = 60, hi = 125, y = v => (hi - v) / (hi - lo) * 100;
  const paths = SERIES.map(s => `<path class="ln" d="${s.v.map((v, i) => `${i ? 'L' : 'M'}${(i / (NPTS - 1) * 1000).toFixed(1)},${y(v).toFixed(2)}`).join('')}" stroke="${s.c}" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>`).join('');
  const ticks = [70, 80, 90, 100, 110, 120];
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'];
  return `<div class="chart"><div class="chart-hd"><h3>Equity, 2 Jan to 30 Jun 2025</h3><div class="chart-lg">${SERIES.map(s => `<span><i class="${s.dash ? 'dash' : ''}" style="border-color:${s.c}"></i>${esc(s.name)}</span>`).join('')}</div></div>

    <div class="xl">${months.map(m => `<span>${m}</span>`).join('')}</div></div>`;
}
function cmpTable() {
  const bt = SERIES.slice(0, 3);
  const best = (k, dir) => bt.reduce((a, b) => (dir * b[k] > dir * a[k] ? b : a)).k;
  const worst = (k, dir) => bt.reduce((a, b) => (dir * b[k] < dir * a[k] ? b : a)).k;
  const cell = (s, k, dir, f) => { const c = s.k === 'bh' ? '' : s.k === best(k, dir) ? 'best' : s.k === worst(k, dir) ? 'worst' : ''; return `<td class="num ${c}">${f(s[k])}</td>`; };
  return `<div class="tw"><table class="pt cmp"><tr><th>Backtest</th><th class="num">Return</th><th class="num">Sharpe</th><th class="num">Max drawdown</th><th class="num c-tr">Trades</th></tr>${SERIES.map(s => `<tr class="${s.k === 'bh' ? 'bench' : ''}"><td><div class="bn"><b><span class="sw" style="background:${s.c}"></span>${esc(s.name)}</b><span>${esc(s.sub)}</span></div></td>${cell(s, 'ret', 1, pct)}${cell(s, 'sh', 1, v => v.toFixed(2))}${cell(s, 'dd', 1, pct)}<td class="num c-tr">${s.tr === null ? '–' : s.tr}</td></tr>`).join('')}</table></div>
    <p class="small">Best value of each column in green, worst in red, as on the Compare page. Example figures for this design.</p>`;
}

    case 'rows': return b.items.map(([l, t, h]) => h ? `- [${l}](${h}) ${t}` : `- **${l}** ${t}`).join('\n');
    case 'steps': return b.items.map((s, i) => `${i + 1}. **${s.title}**\n\n${s.body.map(mdBlock).join('\n\n').replace(/^/gm, '   ')}`).join('\n\n');
    case 'addr': return `Server address \`${MCP_URL}\`, Streamable HTTP.`;
    case 'clients': return CLIENTS.map(c => `### ${c.name}\n\n${CLIENT_BODY[c.k].map(mdBlock).join('\n\n')}`).join('\n\n');
    case 'oneclick': return `[${b.label}](#) ${b.s}`;
    case 'pick': return '- **MCP server**, for chats and coding agents. [Install the server](/docs/mcp/install/)\n- **REST API**, for scripts and your own code. [Run a backtest from a script](/docs/api/backtests/)';
    case 'legend': return Object.values(KIND).map(([n, d]) => `- **${n}** ${d}`).join('\n');
    case 'tindex': return TOOLS.map(([g, ts]) => `- ${g} · ${ts.map(([n]) => '`' + n + '`').join(', ')}`).join('\n');
    case 'tool': { const e = b.e; return `## ${e.name}\n\n${KIND[e.kind][0]} · scope \`${e.scope}\` · \`${e.api}\`\n\n${e.desc}\n\n| Name | Type | Required | What it is |\n| --- | --- | --- | --- |\n${e.params.map(([n, t, r, d]) => `| \`${n}\` | ${t} | ${r ? 'yes' : 'no'} | ${d} |`).join('\n')}\n\nExample call\n\n\`\`\`json\n${J(e.call)}\n\`\`\`\n\nAnswer\n\n\`\`\`json\n${J(e.answer)}\n\`\`\``; }
    case 'langs': return LANGS.map(([k, n, l]) => `${n}\n\n\`\`\`${l === 'py' ? 'python' : l}\n${API_CODE[b.step][k]}\n\`\`\``).join('\n\n');
    case 'out': { const o = API_OUT[b.step]; return `${o.label}\n\n\`\`\`${o.lang}\n${typeof o.code === 'string' ? o.code : o.code.python}\n\`\`\``; }
    case 'ucmeta': return `Claude Code · ${SESSION.length} steps · ${CALLS} tool calls · 2 min 51 s · recorded 6 Nov 2026`;
    case 'session': return SESSION.map((s, i) => `### Step ${i + 1}${s.calls ? ' · ' + [...new Set(s.calls.map(c => c.name))].join(', ') : ' · the answer'}\n\n${s.say ? (s.fin ? '> ' : '') + s.say + '\n\n' : ''}${(s.calls || []).map(c => `Call \`${c.name}\`\n\n\`\`\`json\n${J(c.args)}\n\`\`\`\n\nAnswer\n\n\`\`\`json\n${J(c.answer)}\n\`\`\``).join('\n\n')}`.trim()).join('\n\n');
    case 'chart': return '![Equity of the three backtests and buy and hold, 2 Jan to 30 Jun 2025](equity.svg)';
    case 'cmp': return `| Backtest | Return | Sharpe | Max drawdown | Trades |\n| --- | --- | --- | --- | --- |\n${SERIES.map(s => `| ${s.name} (${s.sub}) | ${pct(s.ret)} | ${s.sh.toFixed(2)} | ${pct(s.dd)} | ${s.tr ?? ''} |`).join('\n')}`;
  }
  return '';
}
function mdOf(key) {
  const p = PAGES[key];

    <a class="brand" href="#agents">CandleStack</a><span class="brand-sl">/</span><a class="brand-docs" href="#agents">Docs</a>
    <nav class="nav" aria-label="Site"><a class="site" href="#none">Status</a><a class="site" href="#none">Meetings</a><a class="site" href="#none">Team</a><a class="on" href="#agents">Docs</a><a href="#none">GitHub</a>
    <button type="button" class="toggle" data-act="theme" aria-label="Toggle dark mode" title="Toggle dark mode">${ic(ROOT.dataset.theme === 'dark' ? 'sun' : 'moon')}</button></nav>
  </div></header>`;
}
function sidebar(cur) {
  return `<aside class="side" aria-label="Docs">${NAV.map(([g, items]) => `<div class="side-g">${g}</div>${items.map(([t, k]) => `<a class="side-l ${k === cur ? 'on' : ''}" href="${k ? PAGE_HASH[k] : '#none'}" ${k === cur ? 'aria-current="page"' : ''}>${esc(t)}</a>`).join('')}`).join('')}
    <div class="side-f"><a href="#none">llms.txt</a><a href="#none">llms-full.txt</a></div>
    <div class="side-site"><a href="#none">Status</a><a href="#none">Meetings</a><a href="#none">Team</a><a href="#none">GitHub</a></div></aside>`;
}
function tocItems(p) {
  const out = [];
  p.blocks().forEach(b => { if (b.t === 'h2') out.push([b.id, b.s, false]); if (b.t === 'tool') out.push([`tool-${b.e.name}`, b.e.name, true]); });
  return out;
}
function page(key) {
  cbN = 0;
  const p = PAGES[key];
  const toc = tocItems(p);
  const tocLinks = toc.map(([id, t, sub]) => `<a href="#${id}" data-act="jumpto" data-val="${id}" class="${sub ? 'sub' : ''}" data-toc="${id}">${esc(t)}</a>`).join('');
  const nojs = S.mode === 'nojs' && key === 'case';
  const body = p.blocks().map(block).join('');
  const pager = [p.prev ? `<a class="pv" href="${p.prev[1] ? PAGE_HASH[p.prev[1]] : '#none'}"><span class="k">← Previous</span><span class="v">${esc(p.prev[0])}</span></a>` : '', p.next ? `<a class="nx" href="${p.next[1] ? PAGE_HASH[p.next[1]] : '#none'}"><span class="k">Next →</span><span class="v">${esc(p.next[0])}</span></a>` : ''].join('');
  const where = p.crumbs.slice(1);
  return `${header()}
  <div class="mbar"><button type="button" data-act="menu" aria-expanded="${S.menu}">${ic(S.menu ? 'x' : 'menu')}${S.menu ? 'Close' : 'Menu'}</button><span class="where">${where.slice(0, -1).map(esc).join(' / ')}${where.length > 1 ? ' / ' : ''}<b>${esc(where[where.length - 1])}</b></span></div>
  <div class="docs">
    ${sidebar(p.nav)}
    <main class="pg" id="main">
      <div class="crumbs">${p.crumbs.map(esc).join('<i>/</i>')}</div>
      <h1>${esc(p.title)}</h1>
      <p class="intro">${esc(p.intro)}</p>
      ${nojs ? '' : `<div class="pact">${copyBtnPage(key)}<a class="btn" href="#md/${key}">${ic('md')}View as Markdown</a>${p.meta ? `<span class="pmeta">${esc(p.meta)}</span>` : ''}</div>`}
      ${nojs ? `<div class="rnote"><b>Review</b>This is the page with JavaScript off. Every step is open as plain text, and the Copy buttons, the tabs and the step controls are gone.</div>` : ''}
      <details class="toc-m" ${S.tocOpen ? 'open' : ''}><summary>On this page ${ic('down')}</summary><nav>${toc.map(([id, t, sub]) => `<a href="#${id}" data-act="jumpto" data-val="${id}" class="${sub ? 'sub' : ''}">${esc(t)}</a>`).join('')}</nav></details>
      ${body}
      <nav class="pnav" aria-label="Pages">${pager}</nav>
      <div class="pfoot"><span>Updated 6 Nov 2026</span><a href="#none">${ic('edit')}Edit this page on GitHub</a></div>
    </main>
    <aside class="toc" aria-label="On this page"><div class="toc-t">On this page</div>${tocLinks}
      <div class="toc-x"><a href="#md/${key}">${ic('md')}View as Markdown</a><a href="#none">${ic('edit')}Edit on GitHub</a></div></aside>
  </div>`;
}
function copyBtnPage(key) {
  CODE['page-' + key] = mdOf(key);
  const done = S.copied === 'page-' + key;
  return `<button type="button" class="btn ${done ? 'done' : ''}" data-act="copy" data-id="page-${key}">${ic(done ? 'check' : 'copy')}${done ? 'Copied' : 'Copy page'}</button>`;
}
function mdPage(key) {
  const p = PAGES[key];
  return `<div class="mdv"><div class="mdv-bar"><a class="btn xs" href="${PAGE_HASH[key]}">${ic('left')}Back</a><div class="mdv-url">candlestack.tech<b>${p.path.replace(/\/$/, '')}.md</b></div><span>text/markdown</span></div><pre>${esc(mdOf(key))}</pre></div>`;
}
function phonePage(which) {
  const sets = {
    case: { t: 'Use case on a phone', p: 'The page at 390 px, and with the Menu open. Desktop first, the phone only needs to look right.', f: [['case/step-4', 'Step 4 of 7'], ['case/step-4/menu', 'Menu open']] },
    install: { t: 'Install on a phone', p: 'Client tabs scroll sideways, code scrolls inside its block, On this page folds at the top.', f: [['install/cursor', 'Cursor tab'], ['install/cursor/toc', 'On this page open']] },
  }[which];
  return `<div class="ph"><div class="ph-t"><h1>${sets.t}</h1><p>${sets.p}</p></div><div class="ph-row">${sets.f.map(([r, c], i) => `<div class="ph-c"><span class="cap">${c} · 390 × 844</span><div class="ph-dev" data-ph="${i}"><iframe title="${esc(c)}" data-route="${r}"></iframe></div></div>`).join('')}</div></div>`;
}

// ---------- the Screens menu (review tool) ----------
const SCREENS = [
  ['Docs layout', [['#agents', 'Agents landing page']]],
  ['MCP install', [['#install/claude-code', 'Claude Code'], ['#install/claude-ai', 'claude.ai'], ['#install/chatgpt', 'ChatGPT'], ['#install/cursor', 'Cursor'], ['#install/vscode', 'VS Code'], ['#install/copied', 'After Copy, Copied']]],
  ['Tool reference', [['#tools', 'Index and two entries']]],
  ['API', [['#api/curl', 'curl'], ['#api/python', 'Python'], ['#api/js', 'JavaScript']]],
  ['Use case', [['#case/step-1', 'Step by step, step 1'], ['#case/step-4', 'Step by step, step 4'], ['#case/step-4/open', 'Step 4, an earlier call opened'], ['#case/all', 'All steps'], ['#case/nojs', 'Without JavaScript']]],
  ['View as Markdown', [['#md/case', 'Use case .md'], ['#md/install', 'Install .md'], ['#md/tools', 'Tools .md']]],
  ['Phone 390 px', [['#phone/case', 'Use case and Menu'], ['#phone/install', 'Install and On this page']]],
];
function scrMenu() {
  if (EMBED) return '';
  const items = SCREENS.map(([g, l]) => `<div class="scr-g">${g}</div>${l.map(([h, t]) => `<button type="button" class="scr-o ${S.hash === h ? 'on' : ''}" data-act="jump" data-val="${h}">${t}<span class="k">${h}</span></button>`).join('')}`).join('');
  return `<div class="scr">${S.sm ? `<div class="scr-p" role="menu"><div class="scr-f"><button type="button" class="btn sm" data-act="theme">${ic(ROOT.dataset.theme === 'dark' ? 'sun' : 'moon')}${ROOT.dataset.theme === 'dark' ? 'Light' : 'Dark'}</button><button type="button" class="btn sm" data-act="notes">${ic('note')}Notes</button></div>${items}</div>` : ''}<button type="button" class="scr-t" data-act="sm" aria-expanded="${S.sm}" title="Every screen and state">${ic('grid')}Screens</button></div>`;
}
const NOTES = `<div class="mbg" data-act="notes-x"><div class="mdl" role="dialog" aria-label="Notes"><div class="mdl-h"><h2>Notes for review</h2><button type="button" class="btn xs" data-act="notes-x">${ic('x')}Close</button></div><div class="notes">
  <div><h3>Look</h3><ul>
    <li>The website’s look: Geist and Geist Mono, its color tokens, the 40 px grid, the plain “CandleStack” brand and the muted nav. Docs joins the nav after Team.</li>
    <li>The chart side decorations of the website are left out on docs pages, the sidebar and the contents take the sides.</li>
    <li>Real 22 px headings with a rule above, so the contents and anchors work. The website’s small mono labels stay for sidebar groups, crumbs and table heads.</li>
  </ul></div>
  <div><h3>Layout</h3><ul>
    <li>Desktop: sidebar 232 px, page up to 720 px, On this page 200 px, max width 1280 px.</li>
    <li>Under 1180 px On this page folds at the top of the page. Under 900 px the sidebar becomes a Menu drawer under the header and the site links move into it.</li>
    <li><code>/docs/</code> opens the Agents page. Previous and Next at the bottom, then the date and Edit this page on GitHub.</li>
    <li>The sidebar ends with <code>llms.txt</code> and <code>llms-full.txt</code>. No search in the first version.</li>
  </ul></div>
  <div><h3>Pieces</h3><ul>
    <li>Copy page copies the page’s Markdown. View as Markdown opens <code>&lt;page&gt;.md</code>, where tabs become sections and the session becomes headings with JSON blocks.</li>
    <li>Code blocks have a label or tabs and Copy, which turns into Copied for 1.6 s. Strings in the accent, numbers in the warn color, comments muted.</li>
    <li>The language picked on one block switches every block on the page and is remembered. The client tab is part of the link, <code>/docs/mcp/install/#cursor</code>.</li>
    <li>Two callouts only, Note and Warning. Screenshots are dashed frames with a caption until the real ones exist.</li>
    <li>Cursor and VS Code get a one-click install button above the manual steps.</li>
  </ul></div>
  <div><h3>Tools and use cases</h3><ul>
    <li>A tool entry has its type (Read only, Changes data, Destructive), its scope and the API endpoint that does the same, then parameters, Example call, Answer and Errors.</li>
    <li>The session opens step by step at step 1. The current step is open, earlier ones fold to one line per call with a short result, later ones are a “N more steps” line. All steps opens everything.</li>
    <li>The outcome is always visible, also before the last step. The chart uses the Compare colors with buy and hold dashed, the table marks the best and worst like Compare.</li>
    <li>Without JavaScript the steps are open <code>&lt;details&gt;</code> elements and the controls are gone.</li>
    <li>Figures in the use case are made up for this design. Backtests carry their generated names.</li>
  </ul></div>
</div></div></div>`;

// ---------- render ----------
function render() {
  let html;
  if (S.page === 'md') html = mdPage(S.md);
  else if (S.page === 'phone') html = phonePage(S.phone);
  else html = page(S.page);
  document.getElementById('app').innerHTML = html;
  document.body.classList.toggle('menu', !!S.menu);
  renderOv();
  document.title = S.page === 'md' ? `${PAGES[S.md].path.replace(/\/$/, '')}.md` : S.page === 'phone' ? 'Phone · Docs · CandleStack' : `${PAGES[S.page].title} · Docs · CandleStack`;
  if (S.page === 'phone') mountPhones();
  bindPlot();
  spy();
}
function renderOv() { document.getElementById('ov').innerHTML = `${scrMenu()}${S.notes ? NOTES : ''}`; }

function mountPhones() {
  const k = Math.min(1, (innerHeight - 170) / 864);
  document.querySelectorAll('.ph-dev').forEach(dev => {
    const fr = dev.querySelector('iframe');
    fr.style.transform = `scale(${k})`;
    dev.style.width = `${390 * k + 20}px`; dev.style.height = `${844 * k + 20}px`;
    fr.srcdoc = SRC.replace(/<html[^>]*>/, `<html lang="en" data-embed="1" data-theme="${ROOT.dataset.theme}" data-route="${fr.dataset.route}">`);
  });
}

// Crosshair and values under the pointer
function bindPlot() {
  const plot = document.getElementById('plot'); if (!plot) return;
  const xh = document.getElementById('xh'), tip = document.getElementById('tip');
  const move = e => {
    const r = plot.getBoundingClientRect();
    const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const i = Math.round(f * (NPTS - 1));
    const x = i / (NPTS - 1) * r.width;
    xh.hidden = false; xh.style.left = `${x}px`;
    tip.hidden = false;
    tip.innerHTML = `<div class="d">${fmtD(dateAt(i))} 2025</div>${SERIES.map(s => `<div class="r"><i style="background:${s.c}"></i>${esc(s.name)}<b>${s.v[i].toFixed(1)}</b></div>`).join('')}`;
    const w = tip.offsetWidth;
    tip.style.left = `${x + 12 + w > r.width ? x - w - 12 : x + 12}px`;
  };
  plot.addEventListener('pointermove', move);
  plot.addEventListener('pointerleave', () => { xh.hidden = true; tip.hidden = true; });
}

// On this page follows the scroll
function spy() {
  const links = [...document.querySelectorAll('.toc a[data-toc]')];
  if (!links.length) return;
  let cur = links[0].dataset.toc;
  links.forEach(a => { const el = document.getElementById(a.dataset.toc); if (el && el.getBoundingClientRect().top < 140) cur = a.dataset.toc; });
  links.forEach(a => a.classList.toggle('on', a.dataset.toc === cur));
}
addEventListener('scroll', spy, { passive: true });

// ---------- routes ----------
function route(h) {
  const raw = (h || '#agents').replace(/^#/, '');
  const [a, b, c] = raw.split('/');
  Object.assign(S, { open: {}, menu: false, tocOpen: false, copied: null, mode: 'step', sm: false, notes: false });
  if (a === 'install') { S.page = 'install'; if (b === 'copied') { S.client = 'claude-code'; S.copied = 'addr'; } else S.client = CLIENTS.some(x => x.k === b) ? b : 'claude-code'; }
  else if (a === 'tools') S.page = 'tools';
  else if (a === 'api') { S.page = 'api'; if (LANGS.some(x => x[0] === b)) S.lang = b; }
  else if (a === 'case') {
    S.page = 'case';
    if (b === 'all') S.mode = 'all';
    else if (b === 'nojs') S.mode = 'nojs';
    else { S.step = Math.min(SESSION.length, Math.max(1, parseInt((b || 'step-1').split('-')[1], 10) || 1)); }
    if (c === 'open') S.open['0-0'] = true;
  }
  else if (a === 'md' && PAGES[b]) { S.page = 'md'; S.md = b; }
  else if (a === 'phone') { S.page = 'phone'; S.phone = b === 'install' ? 'install' : 'case'; }
  else S.page = 'agents';
  if (c === 'menu') S.menu = true;
  if (c === 'toc') S.tocOpen = true;
  S.hash = '#' + raw;
  render();
  scrollTo(0, 0);
}

// ---------- events ----------
document.addEventListener('click', e => {
  const a = e.target.closest('a[href="#none"]');
  if (a) { e.preventDefault(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, val = t.dataset.val;
  if (act === 'notes-x') { if (e.target === t || t.tagName === 'BUTTON') { S.notes = false; renderOv(); } return; }
  if (act === 'sm') { S.sm = !S.sm; renderOv(); return; }
  if (act === 'notes') { S.notes = true; S.sm = false; renderOv(); return; }
  if (act === 'jump') { if (location.hash === val) route(val); else location.hash = val; return; }
  if (act === 'theme') {
    ROOT.dataset.theme = ROOT.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('theme', ROOT.dataset.theme); } catch (err) { /* blocked storage */ }
    const y = scrollY; render(); scrollTo(0, y); return;
  }
  if (act === 'jumpto') {
    e.preventDefault();
    const el = document.getElementById(val); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (S.tocOpen) { S.tocOpen = false; }
    return;
  }
  if (act === 'copy') {
    const id = t.dataset.id;
    try { navigator.clipboard.writeText(CODE[id]); } catch (err) { /* clipboard can be blocked */ }
    S.copied = id; rerender();
    clearTimeout(copyT); copyT = setTimeout(() => { S.copied = null; rerender(); }, 1600);
    return;
  }
  if (act === 'client') { S.client = val; S.hash = `#install/${val}`; history.replaceState(null, '', S.hash); rerender(); return; }
  if (act === 'lang') { S.lang = val; try { localStorage.setItem('docs-lang', val); } catch (err) { /* blocked storage */ } if (S.page === 'api') { S.hash = `#api/${val}`; history.replaceState(null, '', S.hash); } rerender(); return; }
  if (act === 'mode') { S.mode = val; S.open = {}; if (val === 'step') S.step = 1; rerender(); return; }
  if (act === 'next' || act === 'prev') { S.step = Math.max(1, Math.min(SESSION.length, S.step + (act === 'next' ? 1 : -1))); S.open = {}; rerender(); const cur = document.querySelector('.st.cur'); if (cur && act === 'next') cur.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); return; }
  if (act === 'tc') { const open = t.getAttribute('aria-expanded') === 'true'; S.open[val] = !open; rerender(); return; }
  if (act === 'menu') { S.menu = !S.menu; rerender(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.notes) { S.notes = false; renderOv(); } else if (S.sm) { S.sm = false; renderOv(); } else if (S.menu) { S.menu = false; rerender(); } }
  if (S.page === 'case' && S.mode === 'step' && !e.target.closest('input, textarea') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    S.step = Math.max(1, Math.min(SESSION.length, S.step + (e.key === 'ArrowRight' ? 1 : -1))); S.open = {}; rerender();
  }
});
let copyT = 0;
function rerender() { const y = scrollY; render(); scrollTo(0, y); }
addEventListener('resize', () => { if (S.page === 'phone') mountPhones(); });

// ---------- boot ----------
(() => {
  if (!ROOT.dataset.theme) {
    let saved = null; try { saved = localStorage.getItem('theme'); } catch (e) { /* blocked storage */ }
    ROOT.dataset.theme = (saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  addEventListener('hashchange', () => route(location.hash));
  route(EMBED ? '#' + (ROOT.dataset.route || 'agents') : location.hash);
})();
</script>
</body>
</html>
